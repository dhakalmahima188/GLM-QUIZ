<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASL Complete Quiz — All Chapters</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@300;400;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#f7f5f0;--surface:#fff;--surface2:#f1ede5;--border:#ddd8cc;
  --text:#1a1814;--muted:#6b6459;--accent:#2d5fa6;--accent-light:#e8f0fb;
  --green:#1a6e40;--green-light:#e6f5ed;--red:#b71c1c;--red-light:#fdecea;
  --gold:#9a6e10;--radius:10px;--shadow:0 2px 14px rgba(0,0,0,.07);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Source Sans 3',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:80px}

/* ── HEADER ── */
header{background:var(--text);color:#fff;padding:24px 36px 20px;position:sticky;top:0;z-index:200;box-shadow:0 2px 20px rgba(0,0,0,.25)}
.hrow{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px}
header h1{font-family:'Playfair Display',serif;font-size:1.45rem;line-height:1.2}
header p{font-size:.78rem;color:#aaa;margin-top:3px;font-weight:300}
.score-badge{background:var(--accent);color:#fff;padding:7px 18px;border-radius:999px;font-family:'JetBrains Mono',monospace;font-size:.85rem;white-space:nowrap}

/* ── TOOLBAR ── */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:14px 36px;background:var(--surface2);border-bottom:1px solid var(--border)}
.btn{padding:7px 16px;border-radius:6px;border:1.5px solid var(--border);background:var(--surface);color:var(--text);font-family:'Source Sans 3',sans-serif;font-size:.83rem;font-weight:600;cursor:pointer;transition:all .15s}
.btn:hover{background:var(--surface2);border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{background:#1e4a8a}
.btn.danger{background:var(--red);color:#fff;border-color:var(--red)}
.btn.danger:hover{background:#8b0000}
.progress-wrap{flex:1;min-width:160px;height:5px;background:var(--border);border-radius:999px;overflow:hidden}
.progress-fill{height:100%;background:var(--accent);border-radius:999px;transition:width .4s}
.prog-label{font-size:.77rem;color:var(--muted);white-space:nowrap;font-family:'JetBrains Mono',monospace}

/* ── CHAPTER FILTER PILLS ── */
.filter-bar{padding:10px 36px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.filter-label{font-size:.72rem;color:var(--muted);font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-right:4px}
.pill{padding:5px 13px;border-radius:999px;border:1.5px solid var(--border);background:var(--surface);color:var(--muted);font-size:.76rem;font-weight:600;cursor:pointer;transition:all .15s;font-family:'JetBrains Mono',monospace}
.pill:hover{border-color:var(--accent);color:var(--accent)}
.pill.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* ── STATS BAR ── */
.stats-bar{display:flex;gap:24px;padding:12px 36px;background:var(--surface);border-bottom:1px solid var(--border);flex-wrap:wrap}
.stat{display:flex;flex-direction:column;gap:2px}
.stat-val{font-family:'JetBrains Mono',monospace;font-size:1.3rem;font-weight:700}
.stat-val.g{color:var(--green)}.stat-val.r{color:var(--red)}.stat-val.b{color:var(--accent)}
.stat-label{font-size:.71rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}

/* ── CARDS ── */
main{max-width:820px;margin:0 auto;padding:28px 20px;display:flex;flex-direction:column;gap:16px}
.q-card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;transition:box-shadow .2s}
.q-card:hover{box-shadow:0 6px 24px rgba(0,0,0,.11)}
.q-head{display:flex;align-items:flex-start;gap:12px;padding:18px 20px 14px;border-bottom:1px solid var(--border)}
.q-num{font-family:'JetBrains Mono',monospace;font-size:.7rem;font-weight:600;color:var(--muted);background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:2px 7px;white-space:nowrap;flex-shrink:0;margin-top:2px}
.q-text{font-size:.96rem;line-height:1.6;flex:1}
.q-btns{display:flex;gap:9px;padding:12px 20px 14px}
.opt{flex:1;padding:9px 14px;border-radius:7px;border:2px solid var(--border);background:var(--surface);font-family:'Source Sans 3',sans-serif;font-size:.9rem;font-weight:600;cursor:pointer;transition:all .15s;letter-spacing:.02em}
.opt.t{color:var(--green)}.opt.f{color:var(--red)}
.opt:hover:not(:disabled){border-color:currentColor;transform:translateY(-1px);box-shadow:0 3px 8px rgba(0,0,0,.09)}
.opt:disabled{cursor:default;transform:none}
.opt.sel-t{background:var(--green-light);border-color:var(--green);color:var(--green)}
.opt.sel-f{background:var(--red-light);border-color:var(--red);color:var(--red)}
.opt.ok{background:var(--green-light);border-color:var(--green);color:var(--green)}
.opt.bad{background:var(--red-light);border-color:var(--red);color:var(--red);opacity:.55}
.opt.show-ok{background:var(--green-light);border-color:var(--green);color:var(--green)}

.exp{display:none;padding:12px 20px 16px;border-top:1.5px solid var(--border);animation:sd .22s ease}
@keyframes sd{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.exp.vis{display:block}
.exp-inner{border-radius:7px;padding:12px 14px;font-size:.88rem;line-height:1.65}
.exp-inner.ok{background:var(--green-light);border-left:4px solid var(--green)}
.exp-inner.bad{background:var(--red-light);border-left:4px solid var(--red)}
.verdict{font-weight:700;font-size:.82rem;letter-spacing:.05em;text-transform:uppercase;margin-bottom:5px}
.exp-inner.ok .verdict{color:var(--green)}.exp-inner.bad .verdict{color:var(--red)}
.slide-tag{display:inline-block;margin-top:7px;font-family:'JetBrains Mono',monospace;font-size:.72rem;background:#fff;border:1px solid var(--border);border-radius:4px;padding:2px 7px;color:var(--muted)}

/* ── RESULT PANEL ── */
#result-panel{display:none;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:32px;text-align:center;box-shadow:var(--shadow)}
#result-panel.vis{display:block}
#result-panel h2{font-family:'Playfair Display',serif;font-size:1.8rem;margin-bottom:10px}
.big-score{font-family:'JetBrains Mono',monospace;font-size:3rem;font-weight:700;color:var(--accent);margin:8px 0}
.breakdown{display:flex;justify-content:center;gap:28px;margin:16px 0 24px;font-size:.88rem;color:var(--muted)}
.breakdown span{display:flex;flex-direction:column;align-items:center;gap:3px}
.breakdown strong{font-size:1.35rem;font-weight:700}

/* ── EMPTY MSG ── */
.empty{text-align:center;padding:60px 20px;color:var(--muted);font-size:.95rem}

@media(max-width:600px){
  header,.toolbar,.filter-bar,.stats-bar{padding-left:14px;padding-right:14px}
  main{padding:16px 10px}
  .q-btns{flex-direction:column}
}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <div>
      <h1>Advanced Statistical Learning — Complete Quiz</h1>
      <p>All Chapters · 545 True / False Questions</p>
    </div>
    <div class="score-badge" id="scoreBadge">Score: 0</div>
  </div>
</header>

<div class="toolbar">
  <button class="btn primary" onclick="doShuffle()">⇄ Shuffle</button>
  <button class="btn" onclick="doReset()">↺ Reset</button>
  <button class="btn danger" onclick="showResults()">✓ Results</button>
  <div class="progress-wrap"><div class="progress-fill" id="progFill" style="width:0%"></div></div>
  <span class="prog-label" id="progLabel">0 / 0</span>
</div>

<div class="filter-bar">
  <span class="filter-label">Filter:</span>
  <button class="pill active" data-ch="all" onclick="setFilter('all')">All</button>
  <button class="pill" data-ch="1" onclick="setFilter('1')">Ch 1 · Intro</button>
  <button class="pill" data-ch="2" onclick="setFilter('2')">Ch 2 · Classification</button>
  <button class="pill" data-ch="3" onclick="setFilter('3')">Ch 3 · Capacity</button>
  <button class="pill" data-ch="4" onclick="setFilter('4')">Ch 4 · Risk Min.</button>
  <button class="pill" data-ch="5L" onclick="setFilter('5L')">Ch 5 · Linear Models</button>
  <button class="pill" data-ch="5B" onclick="setFilter('5B')">Ch 5 · B-Splines</button>
</div>

<div class="stats-bar">
  <div class="stat"><span class="stat-val g" id="sCorr">0</span><span class="stat-label">Correct</span></div>
  <div class="stat"><span class="stat-val r" id="sWrong">0</span><span class="stat-label">Incorrect</span></div>
  <div class="stat"><span class="stat-val b" id="sLeft">0</span><span class="stat-label">Remaining</span></div>
  <div class="stat" style="margin-left:auto"><span class="stat-val" id="sPct" style="color:var(--muted)">—</span><span class="stat-label">Accuracy</span></div>
</div>

<main id="qContainer"></main>

<div id="result-panel">
  <h2>Quiz Complete</h2>
  <div class="big-score" id="finalScore">—</div>
  <div class="breakdown">
    <span><strong class="g" id="rCorr">0</strong>Correct</span>
    <span><strong class="r" id="rWrong">0</strong>Incorrect</span>
    <span><strong class="b" id="rSkip">0</strong>Skipped</span>
  </div>
  <button class="btn primary" onclick="doReset()">Start Over</button>
</div>

<script>
/* ═══════════════════════════════════════════════════════
   ALL QUESTIONS  — ch: "1"|"2"|"3"|"4"|"5L"|"5B"
   ═══════════════════════════════════════════════════════ */
const ALL_Q = [

/* ──────────────────────── CHAPTER 1 ──────────────────────── */
{ch:"1",t:"Machine Learning is a subset of Artificial Intelligence.",a:true,e:"The diagram shows ML sitting inside the larger field of AI, with Deep Learning as a further subset of ML.",s:"Slide 2"},
{ch:"1",t:"Deep Learning is a superset of Machine Learning.",a:false,e:"Deep Learning is a specialisation (subset) of Machine Learning, not a superset.",s:"Slide 2"},
{ch:"1",t:"According to Tom Mitchell's definition, a program is said to learn if its performance on a task T improves with experience E as measured by performance measure P.",a:true,e:"This is the exact definition given by Mitchell (1998): learn from experience E w.r.t. task T and performance measure P.",s:"Slide 2"},
{ch:"1",t:"A machine learning program can improve its performance on a task without any form of experience or data.",a:false,e:"Mitchell's definition explicitly requires experience E to drive improvement. Without data/experience there is nothing to learn from.",s:"Slide 2"},
{ch:"1",t:"In supervised learning the dataset D consists of input–output pairs (x⁽ⁱ⁾, y⁽ⁱ⁾).",a:true,e:"D = {(x⁽¹⁾,y⁽¹⁾), …, (x⁽ⁿ⁾,y⁽ⁿ⁾)} ⊂ (X × Y)ⁿ is the standard definition of supervised training data.",s:"Slide 4"},
{ch:"1",t:"The input space X is always one-dimensional (p = 1).",a:false,e:"X ⊂ ℝᵖ where p = dim(X) can be any positive integer. Multiple features are the norm in practice.",s:"Slide 4"},
{ch:"1",t:"The j-th feature vector x_j collects the j-th feature value across all n observations.",a:true,e:"x_j = (x_j⁽¹⁾, …, x_j⁽ⁿ⁾) is the j-th feature vector spanning all training examples.",s:"Slide 4"},
{ch:"1",t:"We assume that data is drawn i.i.d. from the joint distribution p(x, y).",a:true,e:"The standard assumption is that observations are drawn independently and identically distributed (i.i.d.) from the joint pdf/pmf p(x, y).",s:"Slide 5"},
{ch:"1",t:"The probability distribution P_xy that generates the data is typically known in advance.",a:false,e:"P_xy is assumed to exist but is typically unknown and very complicated – otherwise we would not need to learn from data.",s:"Slide 5"},
{ch:"1",t:"When distributions are parameterised by θ ∈ Θ, writing p(x, y | θ) implies a Bayesian treatment in this lecture.",a:false,e:"The lecture is developed from a frequentist perspective; p(x,y|θ) is shorthand for p_θ(x,y) and does not imply Bayesian conditioning on θ.",s:"Slide 6"},
{ch:"1",t:"In regression, the output space Y is a subset of real numbers ℝᵍ.",a:true,e:"Regression is defined as predicting a continuous output from Y ⊂ ℝᵍ, with g = 1 for univariate regression.",s:"Slide 7"},
{ch:"1",t:"Multi-Target Regression refers to the case g = 1.",a:false,e:"Multi-Target Regression corresponds to g > 1 (multiple continuous outputs). The lecture focuses on g = 1 (univariate response).",s:"Slide 7"},
{ch:"1",t:"Binary classification is a special case of classification with exactly g = 2 classes.",a:true,e:"When g = 2 the task is binary classification; g > 2 gives multiclass classification.",s:"Slide 7"},
{ch:"1",t:"Density estimation predicts a single class label for each input x.",a:false,e:"Density estimation predicts the full conditional probability distribution p(y|x) over Y, not just a single label.",s:"Slide 7"},
{ch:"1",t:"Classification requires the output space Y to be a finite set of class labels.",a:true,e:"Classification is defined as assigning an input to one class from a finite set Y = {C₁, …, Cg} with g ≥ 2.",s:"Slide 7"},
{ch:"1",t:"The residual r⁽ⁱ⁾ = y⁽ⁱ⁾ − f(x⁽ⁱ⁾) represents the difference between the true output and the model prediction in regression.",a:true,e:"The residual is explicitly defined as r = y − f(x), measuring the gap between true response and predicted score.",s:"Slide 8"},
{ch:"1",t:"In a spam classification task, each email can be represented as a term-frequency vector x⁽ⁱ⁾ ∈ ℝᵖ.",a:true,e:"The slide gives spam detection as a classification example where each email is encoded as a term-frequency vector of dimension p.",s:"Slide 11"},
{ch:"1",t:"Predicting hospital length-of-stay is an example of a classification task.",a:false,e:"Predicting number of days (a continuous metric output) is a regression task, not classification.",s:"Slide 9"},
{ch:"1",t:"A model f is formally defined as a function f : X → ℝᵍ.",a:true,e:"The lecture defines a model as a function mapping inputs x ∈ X to g real-valued scores.",s:"Slide 14"},
{ch:"1",t:"The hypothesis space H contains only the single best model for a task.",a:false,e:"H is the full set of allowed (candidate) models from which the inducer selects. It generally contains infinitely many models.",s:"Slide 14"},
{ch:"1",t:"In regression, the score f(x) is used directly as the prediction ŷ.",a:true,e:"For regression, scores are taken as predictions directly without further transformation.",s:"Slide 14"},
{ch:"1",t:"In classification, scores f(x) can be transformed into class probabilities.",a:true,e:"Scores are transformed to class probabilities or labels (e.g. via sigmoid for binary, softmax for multiclass).",s:"Slide 14"},
{ch:"1",t:"ŷ := f(x) is called the model prediction for input x.",a:true,e:"The lecture defines ŷ := f(x) as the (model) prediction for a given input x ∈ X.",s:"Slide 14"},
{ch:"1",t:"Supervised learning can be viewed as a problem of function approximation.",a:true,e:"The slide states: 'supervised learning faces a problem of function approximation – search for f ∈ H such that s(f(x)) ≈ y'.",s:"Slide 15"},
{ch:"1",t:"An inducing algorithm formally maps a dataset D ∈ (X × Y)ⁿ to a model f ∈ H.",a:true,e:"The formal definition is I_{L,O} : (X × Y)ⁿ → H – the inducer takes data and returns a model.",s:"Slide 15"},
{ch:"1",t:"An inducing algorithm consists of exactly two components: representation and cost function.",a:false,e:"There are THREE components: Representation (hypothesis space) + Cost function + Optimization.",s:"Slide 18"},
{ch:"1",t:"The loss function L must be non-negative.",a:true,e:"L : Y × ℝᵖ → ℝ≥0. Non-negativity is part of the formal definition of a loss function.",s:"Slide 15"},
{ch:"1",t:"The optimizer O in the inducing algorithm is responsible for efficiently searching the hypothesis space for a good model.",a:true,e:"The optimizer is the third component, responsible for searching H. The choice of optimizer is key to the learner's efficiency.",s:"Slide 19"},
{ch:"1",t:"The representation component of an inducer defines which cost function is used during training.",a:false,e:"The representation defines the hypothesis space (which models are possible), while the cost function is a separate, independent component.",s:"Slide 19"},
{ch:"1",t:"For linear regression with the squared error loss, the optimal parameters can be found analytically without iterative numerical optimisation.",a:true,e:"The SSE for linear models can be minimised analytically by differentiating w.r.t. θ (normal equations) – no iterative optimisation is needed.",s:"Slide 20"},
{ch:"1",t:"Decision trees, neural networks, and linear functions are all examples of possible representations (hypothesis spaces).",a:true,e:"The slide lists neighbours, linear functions, decision trees, sets of rules, neural networks, and graphical models as examples of representation choices.",s:"Slide 21"},
{ch:"1",t:"Gradient descent is an example of an optimizer used in inducing algorithms.",a:true,e:"The slide lists gradient descent (along with quadratic programming, combinatorial optimisation, genetic algorithms) as examples of optimizers.",s:"Slide 21"},
{ch:"1",t:"The squared error and misclassification rate are examples of cost functions.",a:true,e:"The slide lists squared error, misclassification, likelihood, and information gain as cost function examples.",s:"Slide 21"},
{ch:"1",t:"The fundamental goal of machine learning is to perform well on the training data.",a:false,e:"The fundamental goal is to generalise beyond training examples. Good training performance alone is insufficient.",s:"Slide 23"},
{ch:"1",t:"The generalisation error of a fixed model f̂ trained on a fixed dataset D is defined as the expected loss over new observations (x,y) ~ P_xy.",a:true,e:"GE(f̂) = E_{(x,y)~P_xy} [L(y, f̂(x))], with D and f̂ fixed while test observations are random.",s:"Slide 23"},
{ch:"1",t:"Using the training error as an estimate of generalisation error gives an over-optimistic (biased) estimate.",a:true,e:"Because the model is optimised specifically to minimise training error, testing on training data gives a biased-low estimate of true generalisation performance.",s:"Slide 25"},
{ch:"1",t:"The generalisation error can be directly computed when P_xy is unknown.",a:false,e:"Since P_xy is typically unknown, the generalisation error cannot be computed directly and must be estimated (e.g. hold-out, cross-validation).",s:"Slide 25"},
{ch:"1",t:"In the holdout method, the test set D_test is held out from training and used only to evaluate the model.",a:true,e:"The data is split D = D_train ∪ D_test; D_test is never used during training, only for evaluation.",s:"Slide 25"},
{ch:"1",t:"The test error is typically lower than the training error.",a:false,e:"The test error is typically greater than or equal to the training error, because the model was optimised on the training data.",s:"Slide 26"},
{ch:"1",t:"If a hypothesis is fixed before seeing the data, the expected training error equals the expected test error.",a:true,e:"Only when the hypothesis is fixed in advance (not learned from data) do the expected training and test errors coincide.",s:"Slide 26"},
{ch:"1",t:"The inner loss is the loss function minimised during model fitting.",a:true,e:"The inner loss is optimised during training to obtain f̂. The outer loss is used afterwards to assess generalisation performance.",s:"Slide 24"},
{ch:"1",t:"The inner loss and outer loss must always be the same function.",a:false,e:"They often differ. E.g. logistic regression minimises the binomial loss (inner) but may be evaluated by misclassification rate or AUC (outer).",s:"Slide 24"},
{ch:"1",t:"The outer loss is also referred to as the performance measure.",a:true,e:"The slide uses 'outer loss' and 'performance measure' interchangeably when defining the generalisation error.",s:"Slide 23"},
{ch:"1",t:"The terms 'inducer', 'learning algorithm', and 'learner' can be used interchangeably.",a:true,e:"The last slide explicitly lists inducer, inducing algorithm, learning algorithm, and learner as synonymous terms.",s:"Slide 29"},
{ch:"1",t:"The terms 'feature', 'covariate', and 'predictor' refer to different quantities in this lecture.",a:false,e:"Feature, attribute, covariate, input variable, and predictor are all used interchangeably throughout the lecture.",s:"Slide 29"},
{ch:"1",t:"'Cost function', 'costs', and 'risk' all refer to the same concept in this lecture.",a:true,e:"The synonyms slide lists cost function, costs, and risk as interchangeable terms for the same concept.",s:"Slide 29"},
{ch:"1",t:"'Training' and 'fitting' are synonyms for the execution of the inducing algorithm.",a:true,e:"The lecture defines: 'The execution of the inducing algorithm I is called training or fitting.'",s:"Slide 15"},

/* ──────────────────────── CHAPTER 2 ──────────────────────── */
{ch:"2",t:"In classification, the goal is to predict a discrete output y from a finite set of class labels.",a:true,e:"Classification aims at predicting a discrete output y ∈ Y = {C₁, …, Cg} with 2 ≤ g < ∞.",s:"Slide 2"},
{ch:"2",t:"In binary classification (g = 2), one valid encoding of the class labels is Y = {0, 1}.",a:true,e:"The slide explicitly states Y = {0,1} or Y = {−1,1} are used for the binary case g = 2.",s:"Slide 2"},
{ch:"2",t:"In binary classification (g = 2), Y = {−1, 1} is an invalid encoding of class labels.",a:false,e:"Both Y = {0,1} and Y = {−1,1} are valid encodings for binary classification.",s:"Slide 2"},
{ch:"2",t:"The multiclass case uses the encoding Y = {1, 2, …, g} for g ≥ 3.",a:true,e:"The slide defines Y = {1, 2, …, g} for the multiclass case with g ≥ 3.",s:"Slide 2"},
{ch:"2",t:"A classification task with g = 1 class is well-defined.",a:false,e:"Classification requires at least 2 classes: 2 ≤ g < ∞. g = 1 is meaningless as there is nothing to classify.",s:"Slide 2"},
{ch:"2",t:"Classification models f : X → ℝᵍ output continuous scores or probabilities rather than discrete class labels directly.",a:true,e:"Models are defined as f : X → ℝᵍ, outputting continuous scores/probabilities, not discrete classes. This is easier to optimise.",s:"Slide 3"},
{ch:"2",t:"It is easier from an optimisation perspective to work directly with discrete class labels than with continuous scores.",a:false,e:"The slide explicitly states it is much easier to optimise costs for continuous-valued functions than for discrete outputs.",s:"Slide 3"},
{ch:"2",t:"Scores and probabilities contain more information than class labels alone.",a:true,e:"Scores/probabilities encode confidence and ranking information beyond just which class is predicted.",s:"Slide 3"},
{ch:"2",t:"Class labels can be transformed back into scores without loss of information.",a:false,e:"Scores can easily be transformed into class labels, but class labels cannot be transformed back into scores – information is lost.",s:"Slide 3"},
{ch:"2",t:"The two main types of classifiers covered are scoring classifiers and probabilistic classifiers.",a:true,e:"The slide states: 'We distinguish scoring and probabilistic classifiers.'",s:"Slide 3"},
{ch:"2",t:"A scoring classifier constructs g discriminant/scoring functions f₁, …, fg : X → ℝ.",a:true,e:"Scoring classifiers construct g scoring functions, one per class, mapping inputs to real-valued scores.",s:"Slide 4"},
{ch:"2",t:"In a scoring classifier, the predicted class is h(x) = argmax_k f_k(x).",a:true,e:"The class with the maximum score is selected: h(x) = argmax_{k∈{1,…,g}} f_k(x).",s:"Slide 4"},
{ch:"2",t:"In a scoring classifier, the predicted class is the one with the minimum score.",a:false,e:"The predicted class is the one with the maximum score, not the minimum.",s:"Slide 4"},
{ch:"2",t:"For binary classification (g = 2) with classes {+1, −1}, a single discriminant function f(x) = f₁(x) − f₋₁(x) is sufficient.",a:true,e:"For g = 2, one function suffices: h(x) = 1 ⟺ f₁(x) > f₋₁(x) ⟺ f(x) = f₁(x) − f₋₁(x) > 0.",s:"Slide 4"},
{ch:"2",t:"In binary classification, h(x) = 1 if and only if f(x) > 0 (where f(x) = f₁(x) − f₋₁(x)).",a:true,e:"The equivalence chain on the slide shows: h(x) = 1 ⟺ f₁(x) > f₋₁(x) ⟺ f(x) > 0.",s:"Slide 4"},
{ch:"2",t:"For a binary scoring classifier, class labels are constructed by h(x) = sgn(f(x)).",a:true,e:"The slide states: 'Class labels are constructed by h(x) = sgn(f(x))'.",s:"Slide 5"},
{ch:"2",t:"The confidence of a scoring classifier is defined as f(x), i.e. the raw score.",a:false,e:"The confidence is |f(x)|, the absolute value of the score, not f(x) itself.",s:"Slide 5"},
{ch:"2",t:"|f(x)| is called the confidence of a scoring classifier.",a:true,e:"The slide explicitly defines: '|f(x)| is called confidence'.",s:"Slide 5"},
{ch:"2",t:"A probabilistic classifier constructs g probability functions π₁, …, πg : X → [0, 1] with Σᵢ πᵢ = 1.",a:true,e:"Probabilistic classifiers output probabilities that are non-negative and sum to 1 across all g classes.",s:"Slide 6"},
{ch:"2",t:"In a probabilistic classifier, the predicted class is h(x) = argmax_k π_k(x).",a:true,e:"Probabilities are converted to labels by selecting the class with the highest probability.",s:"Slide 6"},
{ch:"2",t:"For binary classification (g = 2), the standard threshold for converting probabilities to class labels is c = 0.5.",a:true,e:"h(x) := 1(π(x) ≥ c) with c = 0.5 as the usual default for binary classification.",s:"Slide 6"},
{ch:"2",t:"For binary classification, the threshold c used to convert probabilities to labels must always equal 0.5.",a:false,e:"c = 0.5 is the usual default, but any c ∈ [0,1] can be chosen depending on the application (e.g. cost-sensitive classification).",s:"Slide 6"},
{ch:"2",t:"Probabilistic classifiers can also be viewed as scoring classifiers.",a:true,e:"The slide states: 'Probabilistic classifiers can also be seen as scoring classifiers' – probabilities are a special kind of score.",s:"Slide 6"},
{ch:"2",t:"Discrete class labels produced by a classifier can always be transformed back into meaningful probabilities.",a:false,e:"Once discrete classes are predicted, the probability information is lost and cannot be recovered from the labels alone.",s:"Slide 8"},
{ch:"2",t:"Both scoring and probabilistic classifiers can be converted to discrete class predictions via thresholding (binary) or argmax (multiclass).",a:true,e:"The slide confirms: 'Both scoring and probabilistic classifiers can be turned into discrete classes via thresholding / predicting the class with the maximum score'.",s:"Slide 8"},
{ch:"2",t:"A decision boundary partitions the input space X into g decision regions.",a:true,e:"A decision boundary is defined as a hypersurface partitioning X into g (= number of classes) decision regions Xk = {x ∈ X : h(x) = k}.",s:"Slide 9"},
{ch:"2",t:"In the multiclass case, a decision boundary is the set of points where two scoring functions are equal and both are at least as large as all other scores.",a:true,e:"Formally: {x ∈ X : ∃ i ≠ j s.t. fᵢ(x) = fⱼ(x) and fᵢ(x), fⱼ(x) ≥ fₖ(x) ∀k ≠ i,j}.",s:"Slide 9"},
{ch:"2",t:"For a binary probabilistic classifier with threshold c = 0.5, the decision boundary is the set {x ∈ X : π(x) = 0.5}.",a:true,e:"In the binary case, the decision boundary is f(x) = c; for probabilistic classifiers this is π(x) = 0.5.",s:"Slide 9"},
{ch:"2",t:"For binary scoring classifiers, the typical threshold defining the decision boundary is c = 0.",a:true,e:"The slide states c = 0 is usually used for scoring classifiers and c = 0.5 for probabilistic classifiers.",s:"Slide 9"},
{ch:"2",t:"All classifiers produce the same shape of decision boundary regardless of the algorithm used.",a:false,e:"Different classifiers produce differently shaped boundaries. The slide shows QDA, decision tree, nonlinear SVM, and Naive Bayes all produce different boundary shapes.",s:"Slide 10"},
{ch:"2",t:"QDA, decision trees, nonlinear SVMs, and Naive Bayes are examples of classifiers that produce different shapes of decision boundaries.",a:true,e:"The slide illustrates four classifiers (QDA, decision tree, nonlinear SVM, Naive Bayes) producing visibly different decision boundaries on the same Iris dataset.",s:"Slide 10"},
{ch:"2",t:"A classifier is called linear if its discriminant functions can be written as g(fₖ(x)) = wₖᵀx + bₖ for some monotone transformation g.",a:true,e:"A linear classifier is one where a rank-preserving monotone transformation g of the scoring functions yields linear functions in x.",s:"Slide 11"},
{ch:"2",t:"For a linear classifier, the decision boundary between two classes i and j is given by a hyperplane wᵢⱼᵀx + bᵢⱼ = 0.",a:true,e:"The tie fᵢ(x) = fⱼ(x) reduces to (wᵢ − wⱼ)ᵀx + (bᵢ − bⱼ) = 0, i.e. wᵢⱼᵀx + bᵢⱼ = 0.",s:"Slide 11"},
{ch:"2",t:"Linear classifiers can only represent linear decision boundaries in the original input space under all circumstances.",a:false,e:"Linear classifiers can represent non-linear boundaries in the original input space if derived features are used.",s:"Slide 12"},
{ch:"2",t:"Using polynomial or higher-order interaction features, a linear classifier can produce a non-linear decision boundary in the original input space.",a:true,e:"The slide notes: 'linear classifiers can represent non-linear decision boundaries in the original input space if we use derived features like higher order interactions, polynomial features, basis function expansions, etc.'",s:"Slide 12"},
{ch:"2",t:"A sigmoid function is a bounded, differentiable, real-valued function s : ℝ → [0,1] with a non-negative derivative everywhere.",a:true,e:"This is the exact definition of a sigmoid function given in the lecture.",s:"Slide 13"},
{ch:"2",t:"The logistic function s(t) = 1/(1 + e⁻ᵗ) is an example of a sigmoid function.",a:true,e:"The logistic function is the most commonly used sigmoid, mapping any real score to (0,1).",s:"Slide 14"},
{ch:"2",t:"The hyperbolic tangent tanh(t) is an example of a sigmoid function used for score-to-probability transformation.",a:true,e:"tanh is listed as one of the sigmoid function examples.",s:"Slide 14"},
{ch:"2",t:"Any cumulative density function (cdf) can be used as a sigmoid function.",a:true,e:"The slide lists any cdf as a valid sigmoid. The normal cdf (probit function) is given as a specific example.",s:"Slide 14"},
{ch:"2",t:"Sigmoid functions are only used in classification and have no role in deep learning.",a:false,e:"The slide explicitly notes: 'In deep learning sigmoids are used as activation functions.'",s:"Slide 13"},
{ch:"2",t:"The logistic function satisfies lim_{t→−∞} s(t) = 0 and lim_{t→+∞} s(t) = 1.",a:true,e:"These are stated as properties of the logistic function on slide 15.",s:"Slide 15"},
{ch:"2",t:"The derivative of the logistic function is ∂s(t)/∂t = s(t)(1 − s(t)).",a:true,e:"This is an explicitly stated property: ∂s(t)/∂t = exp(t)/(1+exp(t))² = s(t)(1−s(t)).",s:"Slide 15"},
{ch:"2",t:"The logistic function is symmetric about the point (0, 1).",a:false,e:"The logistic function is symmetric about the point (0, 1/2), not (0, 1).",s:"Slide 15"},
{ch:"2",t:"The logistic function s(t) = 1/(1+e⁻ᵗ) is used in logistic regression to transform scores to probabilities.",a:true,e:"The slide states: 'The logistic function is a popular choice for transforming scores to probabilities (used, for example, in logistic regression).'",s:"Slide 15"},
{ch:"2",t:"The softmax function maps a g-dimensional score vector to a probability vector where all entries are in [0,1] and sum to 1.",a:true,e:"The softmax squashes z ∈ ℝᵍ to a vector in [0,1]ᵍ with all entries summing to 1: s(z)ₖ = exp(zₖ)/Σⱼexp(zⱼ).",s:"Slide 16"},
{ch:"2",t:"The softmax function is defined as s(z)ₖ = exp(zₖ) / Σⱼ exp(zⱼ).",a:true,e:"This is the exact definition of the softmax function given in the lecture.",s:"Slide 16"},
{ch:"2",t:"The softmax function is a generalisation of the logistic function.",a:true,e:"The slide states: 'It is a generalization of the logistic function (check for g = 2).'",s:"Slide 17"},
{ch:"2",t:"Unlike the argmax operator, the softmax keeps information about all non-maximal scores in a reversible way.",a:true,e:"The slide notes: 'Compared to the argmax operator, the softmax keeps information about the other, non-maximal elements in a reversible way.'",s:"Slide 17"},
{ch:"2",t:"The softmax function is used for binary classification only and cannot be applied in the multiclass setting.",a:false,e:"The softmax is specifically designed for multiclass settings (g > 2). It reduces to the logistic function for g = 2.",s:"Slide 17"},
{ch:"2",t:"The generative approach models the class-conditional density P(x | y = k) and uses Bayes' theorem to obtain posterior probabilities.",a:true,e:"Generative approaches use Bayes' theorem: π_k(x) = P(y=k|x) ∝ P(x|y=k)·πₖ, modelling the class-conditional densities.",s:"Slide 19"},
{ch:"2",t:"Discriminant approaches try to model the discriminant functions directly, often by loss minimisation.",a:true,e:"The slide states: 'Discriminant approaches try to model the discriminant functions directly, often by loss minimization.'",s:"Slide 19"},
{ch:"2",t:"Linear Discriminant Analysis (LDA) is a generative, linear classifier that assumes each class has a multivariate Gaussian density with equal covariances.",a:true,e:"LDA assumes P(x|y=k) ~ N(μₖ, Σ) with equal covariance Σ across classes, making it generative and linear.",s:"Slide 20"},
{ch:"2",t:"Quadratic Discriminant Analysis (QDA) assumes equal covariance matrices across all classes.",a:false,e:"QDA assumes class-specific covariances Σₖ (unequal across classes). LDA assumes equal covariances. This difference is what makes QDA non-linear.",s:"Slide 20"},
{ch:"2",t:"QDA produces non-linear decision boundaries.",a:true,e:"QDA is described as 'generative, non-linear' because the class-specific covariance matrices Σₖ lead to quadratic (non-linear) decision boundaries.",s:"Slide 20"},
{ch:"2",t:"Naive Bayes assumes that features are conditionally independent given the class label.",a:true,e:"The 'naive' assumption is conditional independence: P(x|y=k) = ∏ⱼ P(xⱼ|y=k).",s:"Slide 21"},
{ch:"2",t:"Naive Bayes is a discriminative classifier.",a:false,e:"Naive Bayes is a generative classifier – it models the class-conditional densities P(x|y=k) and applies Bayes' theorem.",s:"Slide 21"},
{ch:"2",t:"Logistic regression is a discriminative classifier.",a:true,e:"The slide lists logistic regression as 'discriminant, (usually) linear' – it models the discriminant functions directly rather than class-conditional densities.",s:"Slide 21"},

/* ──────────────────────── CHAPTER 3 ──────────────────────── */
{ch:"3",t:"Failure to obtain a sufficiently low training error is known as underfitting.",a:true,e:"Underfitting occurs when the model lacks the capacity to capture the structure in the training data, resulting in a high training error.",s:"Slide 1"},
{ch:"3",t:"Overfitting is defined as a large difference between training error and test error.",a:true,e:"Overfitting means the model has learned the training data (including its noise) so well that it fails to generalize — the training error is low but the test error is much higher.",s:"Slide 1"},
{ch:"3",t:"A model with low capacity tends to overfit the training data.",a:false,e:"Low capacity leads to underfitting, not overfitting. A low-capacity model can only learn a few simple hypotheses and cannot capture complex patterns.",s:"Slide 2"},
{ch:"3",t:"The test error is minimized when the model has the right capacity — neither underfitting nor overfitting.",a:true,e:"As shown in the capacity curve, the test error forms a U-shape. Too little capacity → underfitting; too much capacity → overfitting; optimal capacity → minimum test error.",s:"Slide 2"},
{ch:"3",t:"A model with a large capacity can only learn a few simple hypotheses.",a:false,e:"It is the opposite: a model with large capacity can learn many, possibly complex hypotheses. A model with low capacity is restricted to a few simple hypotheses.",s:"Slide 2"},
{ch:"3",t:"In the capacity vs. error plot, the training error monotonically decreases as capacity increases.",a:true,e:"With more capacity, the model can fit the training data better and better. The training error decreases monotonically toward zero.",s:"Slide 1"},
{ch:"3",t:"Increasing the degree of a polynomial in linear regression increases the capacity of the model.",a:true,e:"A higher-degree polynomial expands the hypothesis space — more complex curves become representable. This increases model capacity.",s:"Slide 8"},
{ch:"3",t:"As the size of the hypothesis space increases, the tendency to overfit decreases.",a:false,e:"The opposite is true: larger hypothesis spaces give the model more flexibility to fit random noise in the training data, increasing the tendency to overfit.",s:"Slide 8"},
{ch:"3",t:"In k-nearest neighbours, k=1 leads to overfitting (high capacity), while large k leads to underfitting (low capacity).",a:true,e:"k=1 memorizes every training point (training error = 0), creating a very complex, irregular decision boundary — overfitting. Large k averages over many neighbors, producing a smoother, less flexible boundary — underfitting.",s:"Slide 13"},
{ch:"3",t:"For k=1 in kNN, the training error is always 0.",a:true,e:"With k=1, each training point's nearest neighbor is itself, so every training point is classified correctly. The training error is 0 by construction.",s:"Slide 14"},
{ch:"3",t:"The hypothesis space H is the set of all functions that a learner is allowed to consider for a given task.",a:true,e:"By definition, H = {f : X → R^g | f has a specific form}. It defines the representation of the learning algorithm — the space of all candidate models.",s:"Slide 3"},
{ch:"3",t:"A separating hyperplane classifier outputs h(x|θ₀, θ) = 1(x^T θ − θ₀ > 0), which is a soft probabilistic output.",a:false,e:"The indicator function 1(·) outputs a hard binary label (0 or 1), not a probability. For probabilistic outputs, one would use logistic regression or apply a sigmoid transformation.",s:"Slide 4"},
{ch:"3",t:"Decision trees partition the feature space into axis-aligned rectangles.",a:true,e:"Decision trees recursively split the feature space using axis-parallel cuts. The prediction in each region Qᵢ is a constant cᵢ.",s:"Slide 5"},
{ch:"3",t:"Ensemble methods aggregate predictions of several models; examples include random forests, bagging, and tree-based boosting.",a:true,e:"Ensemble methods combine multiple base learners. Examples noted in the slides include random forests, bagging, and tree-based boosting.",s:"Slide 5"},
{ch:"3",t:"The VC dimension of a hypothesis class H is the largest number of points that can be shattered by H in at least one configuration.",a:true,e:"Shattering means H can produce any binary labeling of the points. The VC dimension is the maximum size of a set that CAN be shattered — it doesn't have to be every configuration of that size, just one.",s:"Slide 15"},
{ch:"3",t:"If the VC dimension of H is d, then every set of d points can be shattered by H.",a:false,e:"VC dimension d means there EXISTS at least one set of d points that can be shattered — NOT that all sets of size d can be shattered.",s:"Slide 15"},
{ch:"3",t:"The VC dimension of linear classifiers (separating hyperplanes) in ℝ² is 3.",a:true,e:"VC₂(H) = 3 for non-homogeneous halfspaces in ℝ². They can shatter 3 points in general position but cannot shatter any configuration of 4 points.",s:"Slide 16"},
{ch:"3",t:"The VC dimension of non-homogeneous halfspaces h(x|θ) = sign(x^T θ + θ₀) in ℝᵖ is p+1.",a:true,e:"Adding the bias term θ₀ increases the VC dimension by 1 compared to homogeneous halfspaces. The proof reduces non-homogeneous halfspaces in ℝᵖ to homogeneous ones in ℝᵖ⁺¹.",s:"Slide 20"},
{ch:"3",t:"The VC dimension of axis-aligned rectangles in ℝ² is 4.",a:true,e:"Rectangles can shatter 4 points (one at each extreme: leftmost, rightmost, highest, lowest). For any 5 points, the 5th always falls inside the rectangle defined by the other 4 extremal points.",s:"Slide 22"},
{ch:"3",t:"The VC dimension of k-nearest neighbours with k=1 is infinite.",a:true,e:"1-NN can shatter any set of points: for any labeling, it assigns each training point its own label exactly. There is no upper bound on the number of points it can shatter.",s:"Slide 22"},
{ch:"3",t:"A single-parameter threshold classifier h(x) = 1(x ≥ θ) has VC dimension 1.",a:true,e:"It can shatter any single point (label it 0 or 1 by moving θ). But for any 2 points, if the smaller is labeled 1, the larger must also be 1.",s:"Slide 27"},
{ch:"3",t:"A single-parameter sine classifier h(x) = 1[sin(θx) > 0] has VC dimension 1, since it has only one parameter.",a:false,e:"Despite having only ONE parameter θ, the sine classifier has INFINITE VC dimension. By choosing θ large enough, the oscillations can be made fine enough to shatter any finite set of points.",s:"Slide 28"},
{ch:"3",t:"The VC dimension provides a probabilistic upper bound on the test error given the training error.",a:true,e:"The bound states: P(err_test ≤ err_train + ε) = 1 − δ, where ε depends on the VC dimension d and training set size. Higher VC dimension → looser bound.",s:"Slide 25"},
{ch:"3",t:"VC bounds are tight and practical for evaluating neural network performance.",a:false,e:"VC bounds are extremely loose and pessimistic. They must hold for any arbitrary distribution P_xy, requiring unrealistically large training sets. In practice, neural networks perform far better than VC bounds suggest.",s:"Slide 29"},
{ch:"3",t:"The effective capacity of a learning algorithm depends only on the hypothesis space, not on the optimizer used.",a:false,e:"The lecture explicitly states that effective capacity depends in a complicated way on the optimizer as well. Different optimizers may explore the hypothesis space differently.",s:"Slide 29"},
{ch:"3",t:"The generalization error can be decomposed into three terms: variance of the data (noise), variance of the inducer, and squared bias of the inducer.",a:true,e:"GEn = σ² (irreducible noise) + E[Var(f̂)] (variance) + E[E²(f_true - f̂)] (squared bias). This is the bias-variance decomposition under the L2 loss.",s:"Slide 33"},
{ch:"3",t:"The noise term σ² in the bias-variance decomposition can be reduced to zero by using a sufficiently complex model.",a:false,e:"σ² is the intrinsic/unavoidable error — the irreducible noise in the data. No matter which learner we use, we will never get below this error.",s:"Slide 34"},
{ch:"3",t:"The bias of a learner measures its tendency to consistently mispredict certain instances regardless of the training data.",a:true,e:"Bias = E²[f_true(x) - f̂(x)]. It captures systematic, consistent errors. A high-bias model (low capacity) cannot represent the true function.",s:"Slide 35"},
{ch:"3",t:"The variance of a learner measures how much the model's predictions change as we vary the training dataset.",a:true,e:"Variance = Var_{D_n}(f̂(x)): how much does the trained model vary across different training sets drawn from the same distribution? High variance = overfitting.",s:"Slide 35"},
{ch:"3",t:"Models with high capacity have low bias and high variance.",a:true,e:"High capacity → complex hypothesis space → the model can fit the true function (low bias) but is also sensitive to the specific training data (high variance). This matches the overfitting behavior.",s:"Slide 35"},
{ch:"3",t:"Models with low capacity have low bias and high variance.",a:false,e:"Low capacity → restricted hypothesis space → the model cannot fit the true function (HIGH bias), but its limited flexibility means it is insensitive to training set variation (LOW variance).",s:"Slide 35"},
{ch:"3",t:"The bias-variance trade-off means it is generally impossible to simultaneously achieve low bias and low variance.",a:true,e:"Increasing capacity lowers bias but raises variance; decreasing capacity raises bias but lowers variance. This fundamental trade-off means optimal performance requires balancing the two.",s:"Slide 37"},
{ch:"3",t:"As model capacity increases, both bias and variance increase simultaneously.",a:false,e:"They trade off: as capacity increases, bias DECREASES while variance INCREASES. The generalization error is their sum.",s:"Slide 37"},
{ch:"3",t:"As the size of the training set grows indefinitely, both the training error and generalization error converge to the bias of the algorithm (assuming zero noise).",a:true,e:"With more data, the variance term vanishes (more stable estimates), so both errors converge to the irreducible bias.",s:"Slide 38"},
{ch:"3",t:"To reduce underfitting, one should make the model less flexible or apply regularization.",a:false,e:"Underfitting is caused by high bias (too little capacity). To reduce underfitting, one should make the model MORE flexible (increase capacity). Regularization reduces variance (fights overfitting).",s:"Slide 39"},
{ch:"3",t:"To reduce overfitting, one can add more training data or apply regularization.",a:true,e:"Overfitting is high variance. More data reduces variance (more stable estimates), and regularization explicitly constrains model complexity. Both reduce the gap between training and test error.",s:"Slide 39"},
{ch:"3",t:"The No Free Lunch theorem states that when averaged over all possible problems, no learning algorithm is better than any other, including random guessing.",a:true,e:"NFL is a fundamental result: specialization on one class of problems comes at the cost of worse performance on others. Summing over all possible data-generating distributions, every algorithm performs equally.",s:"Slide 42"},
{ch:"3",t:"The No Free Lunch theorem implies that no single algorithm is universally the best for all problems.",a:true,e:"This is the direct implication: any algorithm that excels on one problem distribution must fail on another. There is no 'master algorithm' that dominates all others on all tasks.",s:"Slide 43"},
{ch:"3",t:"In practice, the No Free Lunch theorem makes machine learning impossible.",a:false,e:"In practice, we only encounter an infinitesimal subset of all possible problems. By incorporating valid prior assumptions (smoothness, linearity, etc.), ML works well in practice.",s:"Slide 44"},
{ch:"3",t:"Machine learning is considered an ill-posed problem because even after observing training data, many consistent hypotheses remain.",a:true,e:"With 4 boolean features, there are 2^16 = 65536 possible functions. After observing 7 training examples, 2^9 = 512 functions remain consistent. Without assumptions, we cannot choose among them.",s:"Slide 41"},
{ch:"3",t:"Without making assumptions (inductive bias) about the problem, machine learning simply is not possible.",a:true,e:"The No Free Lunch theorem formalizes this: without prior assumptions, no algorithm generalizes. In practice, assumptions like smoothness, linearity, or locality make generalization possible.",s:"Slide 43"},

/* ──────────────────────── CHAPTER 4 (130 questions) ──────────────────────── */
{ch:"4",t:"Machine learning can be fully described by three components: representation (hypothesis space), cost function, and optimization.",a:true,e:"Exactly. Learning = Representation + Cost + Optimization. These three are the fundamental building blocks of any supervised learning algorithm.",s:"Slide 4-1 (Risk Min. I)"},
{ch:"4",t:"Given a fixed hypothesis space, different cost functions will always yield the same optimal model.",a:false,e:"Even within the same hypothesis space of linear models, different cost functions (L1, L2, quantile loss, etc.) yield different fitted models. The cost function determines what 'best' means.",s:"Slide 4-3 (Risk Min. I)"},
{ch:"4",t:"A loss function L(y, f(x)) must satisfy non-negativity: L(y, ỹ) ≥ 0 for all y, ỹ ∈ Y.",a:true,e:"This is one of the two required properties of a loss function: (1) non-negativity and (2) optimality: L(y, ỹ) = 0 iff y = ỹ. The function y − f(x) fails because it can be negative.",s:"Slide 4-4 (Risk Min. I)"},
{ch:"4",t:"A loss function equals zero if and only if the prediction equals the true target.",a:true,e:"The optimality condition: L(y, ỹ) = 0 ⟺ y = ỹ. Perfect predictions incur zero cost, and any deviation incurs a strictly positive penalty.",s:"Slide 4-4 (Risk Min. I)"},
{ch:"4",t:"L(y, f(x)) = y − f(x) is a valid loss function for regression.",a:false,e:"This does not satisfy non-negativity, since y − f(x) can be negative (when the prediction overshoots). A valid regression loss must be ≥ 0 everywhere.",s:"Slide 4-4 (Risk Min. I)"},
{ch:"4",t:"The residual is defined as r = y − f(x), the difference between the true target and the model's prediction.",a:true,e:"The residual measures the raw prediction error. Regression losses that can be written purely as a function of r are called distance-based losses.",s:"Slide 4-6 (Risk Min. I)"},
{ch:"4",t:"A distance-based loss can be written as L(y, f(x)) = ψ(r) for some function ψ with ψ(0) = 0.",a:true,e:"A loss is distance-based if it depends only on the residual r = y − f(x) and equals zero when r = 0. This is equivalent to the loss being translation-invariant.",s:"Slide 4-6 (Risk Min. I)"},
{ch:"4",t:"Translation-invariance and distance-based are two different properties that a loss may have independently of each other.",a:false,e:"They are equivalent: a loss is translation-invariant if and only if it is distance-based. The proof goes both ways.",s:"Slide 4-7 (Risk Min. I)"},
{ch:"4",t:"Pseudo-residuals are defined as the negative first derivative of the loss function with respect to f.",a:true,e:"The pseudo-residual is r̃ = −∂L(y, f(x))/∂f. For the L2-loss, the pseudo-residual equals y − f(x) = r.",s:"Slide 4-7 (Risk Min. I)"},
{ch:"4",t:"For the L2-loss, pseudo-residuals and ordinary residuals are identical.",a:true,e:"Using L = 0.5(y − f(x))², we compute: r̃ = −∂/∂f [0.5(y − f(x))²] = y − f(x) = r.",s:"Slide 4-7 (Risk Min. I)"},
{ch:"4",t:"Theoretical risk minimization requires knowledge of the true joint distribution P_xy.",a:true,e:"The theoretical risk is R(f) = E[L(y, f(x))] = ∫ L(y, f(x)) dP_xy. Computing or minimizing this requires knowing P_xy.",s:"Slide 4-9 (Risk Min. I)"},
{ch:"4",t:"For the L2-loss with an unrestricted hypothesis space, the optimal prediction at input x is the conditional mean E[y | x].",a:true,e:"Minimizing E[(y − f(x))² | x] point-wise over all possible f(x) = c is minimized at c = E[y | x].",s:"Slide 4-10 & 4-11 (Risk Min. I)"},
{ch:"4",t:"The empirical risk R_emp(f) = Σ L(y^(i), f(x^(i))) approximates the theoretical risk when the data is i.i.d. from P_xy.",a:true,e:"By the law of large numbers, the empirical average converges to E[L(y, f(x))] = R(f) as n → ∞.",s:"Slide 4-13 (Risk Min. I)"},
{ch:"4",t:"The factor 1/n in the empirical risk affects which model is chosen as the minimizer.",a:false,e:"The factor 1/n is a positive constant that does not change the location of the minimum. R_emp and R̄_emp yield the same θ̂.",s:"Slide 4-13 (Risk Min. I)"},
{ch:"4",t:"If the loss function is convex in its second argument and f(x|θ) is linear in θ, then R_emp(θ) is convex.",a:true,e:"A sum of convex functions is convex. Convexity guarantees that every local minimum is a global minimum, making gradient-based optimization reliable.",s:"Slide 4-15 (Risk Min. I)"},
{ch:"4",t:"The L2-loss is defined as L(y, f(x)) = (y − f(x))², and it is both convex and differentiable everywhere.",a:true,e:"The L2-loss is a quadratic in the residual — globally convex (second derivative 2 > 0 everywhere) and infinitely differentiable.",s:"Slide 4-17 (Risk Min. I)"},
{ch:"4",t:"The L2-loss penalizes large residuals disproportionately: if the residual doubles, the loss quadruples.",a:true,e:"Since L = r², doubling r gives L = (2r)² = 4r². Outliers dominate the empirical risk.",s:"Slide 4-17 (Risk Min. I)"},
{ch:"4",t:"The optimal constant model f(x) = θ that minimizes the empirical L2-risk is the sample mean ȳ.",a:true,e:"Setting ∂R_emp/∂θ = −2 Σ(y^(i) − θ) = 0 gives θ̂ = ȳ.",s:"Slide 4-18 & 4-19 (Risk Min. I)"},
{ch:"4",t:"Gaussian errors in the data generating process correspond to L2 loss minimization via maximum likelihood.",a:true,e:"If ε ~ N(0, σ²), the MLE objective is equivalent to minimizing Σ(y^(i) − f(x^(i)|θ))², i.e., the L2 empirical risk.",s:"Slide 4-49 (Risk Min. I)"},
{ch:"4",t:"The L1-loss L(y, f(x)) = |y − f(x)| is more robust to outliers than the L2-loss.",a:true,e:"|r| grows linearly rather than quadratically with the residual, so outliers contribute proportionally. The optimal constant is the median, not the mean.",s:"Slide 4-21 (Risk Min. I)"},
{ch:"4",t:"The L1-loss is differentiable everywhere, making it straightforward to use with gradient descent.",a:false,e:"The absolute value function |r| is not differentiable at r = 0. Standard gradient descent is inapplicable at that point.",s:"Slide 4-21 (Risk Min. I)"},
{ch:"4",t:"The optimal constant model with respect to the L1-loss is the sample median of the observed responses.",a:true,e:"Minimizing Σ|y^(i) − θ| over θ yields θ̂ = median({y^(i)}). The median minimizes the sum of absolute deviations.",s:"Slide 4-22 (Risk Min. I)"},
{ch:"4",t:"Laplace-distributed errors in the data generating process correspond to L1 loss minimization via maximum likelihood.",a:true,e:"If ε ~ Laplace(0, b), the negative log-likelihood is proportional to Σ|y^(i) − f(x^(i)|θ)|, exactly the L1 empirical risk.",s:"Slide 4-50 (Risk Min. I)"},
{ch:"4",t:"The quantile (pinball) loss with α = 0.5 is equivalent to the L1-loss (up to a constant factor).",a:true,e:"At α = 0.5, the quantile loss becomes L = 0.5|y − f(x)| for both positive and negative residuals. This equals 0.5 × L1-loss.",s:"Slide 4-24 (Risk Min. I)"},
{ch:"4",t:"With α < 0.5, the quantile loss penalizes over-estimation (f(x) > y) more than under-estimation.",a:true,e:"When α < 0.5, the factor (1−α) > 0.5 > α, so over-prediction is penalized more than under-prediction.",s:"Slide 4-24 (Risk Min. I)"},
{ch:"4",t:"The optimal constant model with respect to the quantile loss is the empirical α-quantile of the response values.",a:true,e:"Minimizing the asymmetric quantile loss over a constant θ yields θ̂ = Q_α({y^(i)}), the empirical α-quantile.",s:"Slide 4-26 (Risk Min. I)"},
{ch:"4",t:"The quantile loss is differentiable everywhere, just like the L2-loss.",a:false,e:"The quantile loss is piecewise linear (like L1), with a kink at the point where the residual is zero. It is not differentiable at this point.",s:"Slide 4-24 (Risk Min. I)"},
{ch:"4",t:"The Huber loss is convex, differentiable everywhere, and more robust than L2.",a:true,e:"The Huber loss combines L2 (for |r| ≤ δ) and L1 (for |r| > δ), making it convex, differentiable everywhere, and robust to outliers.",s:"Slide 4-28 (Risk Min. I)"},
{ch:"4",t:"For residuals smaller than δ in absolute value, the Huber loss behaves like the L1-loss.",a:false,e:"For |r| ≤ δ, the Huber loss is (1/2)(y − f(x))², which is the L2-loss. Only for |r| > δ does it switch to linear behavior.",s:"Slide 4-28 (Risk Min. I)"},
{ch:"4",t:"The optimal constant model for Huber loss has a closed-form analytical solution.",a:false,e:"Unlike L2 (mean) and L1 (median), the Huber loss has no closed-form minimizer. Numerical iterative optimization methods are required.",s:"Slide 4-30 (Risk Min. I)"},
{ch:"4",t:"As δ increases, the Huber loss behaves more and more like the L2-loss.",a:true,e:"As δ → ∞, the linear part becomes increasingly irrelevant. In the limit, all residuals fall in the quadratic region, and Huber becomes identical to L2.",s:"Slide 4-29 (Risk Min. I)"},
{ch:"4",t:"The ε-insensitive loss assigns zero penalty to predictions that fall within ε of the true value.",a:true,e:"The ε-insensitive loss is L = 0 if |y − f(x)| ≤ ε, and |y − f(x)| − ε otherwise. This is the loss used in Support Vector Regression (SVR).",s:"Slide 4-41 (Risk Min. I)"},
{ch:"4",t:"The log-barrier loss imposes an infinite penalty for residuals larger than a threshold a.",a:true,e:"The log-barrier loss is L = −a² log(1 − (|r|/a)²) for |r| ≤ a, and ∞ for |r| > a.",s:"Slide 4-43 (Risk Min. I)"},
{ch:"4",t:"The log-barrier loss behaves like the L1-loss for small residuals.",a:false,e:"For small residuals (|r| ≪ a), the log-barrier loss approximates the L2-loss (quadratic behavior). For small r, −a² log(1 − (r/a)²) ≈ r².",s:"Slide 4-43 (Risk Min. I)"},
{ch:"4",t:"Gradient descent updates parameters by moving in the direction of the negative gradient of the empirical risk.",a:true,e:"The update rule is θ^[j+1] = θ^[j] − α^[j] · ∇_θ R_emp(θ). The negative gradient points in the direction of steepest descent.",s:"Slide 4-32 (Risk Min. I)"},
{ch:"4",t:"Standard (batch) gradient descent uses all training observations to compute each gradient update.",a:true,e:"In standard gradient descent, ∇R_emp = (1/n)Σ_{i=1}^n ∇_θ L(y^(i), f(x^(i)|θ)). Every training example contributes to each update.",s:"Slide 4-32 (Risk Min. I)"},
{ch:"4",t:"Stochastic Gradient Descent (SGD) uses a single randomly drawn observation per update step.",a:true,e:"SGD approximates the true gradient using a single observation. This makes each update cheap to compute but introduces high variance.",s:"Slide 4-39 (Risk Min. I)"},
{ch:"4",t:"Mini-batch gradient descent uses a random subset of observations per update.",a:true,e:"Mini-batch GD balances the computational efficiency of SGD with lower gradient variance than SGD.",s:"Slide 4-40 (Risk Min. I)"},
{ch:"4",t:"Gradient descent is guaranteed to find the global minimum of the empirical risk for any loss function.",a:false,e:"Gradient descent is only guaranteed to converge to a local minimum. Only when R_emp(θ) is convex does every local minimum equal the global minimum.",s:"Slide 4-15 & 4-32 (Risk Min. I)"},
{ch:"4",t:"Minimizing the negative log-likelihood is equivalent to minimizing the empirical risk when the loss is L(y, f(x|θ)) = −log p(y|x, θ).",a:true,e:"If L = −log p(y|x, θ), then R_emp(θ) = −ℓ(θ), the negative log-likelihood. Minimizing R_emp is identical to maximizing ℓ(θ), the MLE objective.",s:"Slide 4-47 (Risk Min. I)"},
{ch:"4",t:"For every loss function, there exists a corresponding probability distribution for the errors.",a:false,e:"Some losses cannot be expressed as −log p(y|x, θ) for any proper probability density p. The hinge loss (used in SVMs) is the most prominent example.",s:"Slide 4-48 (Risk Min. I)"},
{ch:"4",t:"Multiplicative constants in the loss function do not change the optimal parameter estimate.",a:true,e:"For any constant c > 0: argmin_θ c·R_emp(θ) = argmin_θ R_emp(θ). Scaling by a positive constant does not change the location of the minimum.",s:"Slide 4-48 (Risk Min. I)"},
{ch:"4",t:"In classification, loss functions can be defined on hard labels h(x), class scores f(x), or class probabilities π(x).",a:true,e:"These three types correspond to hard-label classifiers, scoring classifiers, and probabilistic classifiers.",s:"Slide 4-8 (Risk Min. II)"},
{ch:"4",t:"The margin y·f(x) is positive if and only if the prediction sign(f(x)) matches the true class y.",a:true,e:"With y ∈ {−1, +1}: if y = sign(f(x)), then y and f(x) have the same sign, so y·f(x) > 0.",s:"Slide 4-9 (Risk Min. II)"},
{ch:"4",t:"The quantity |f(x)| is called the confidence of a binary scoring classifier.",a:true,e:"While sign(f(x)) gives the predicted class, |f(x)| measures how confident the classifier is in that prediction.",s:"Slide 4-9 (Risk Min. II)"},
{ch:"4",t:"The binary 0-1 loss is not continuous and its optimization is NP-hard even for linear classifiers.",a:true,e:"L = 1{y·f(x)<0} is a step function — not continuous, not differentiable. Minimizing the empirical 0-1 loss is NP-hard even for linear f.",s:"Slide 4-11 (Risk Min. II)"},
{ch:"4",t:"The optimal constant classifier w.r.t. the multiclass 0-1-loss always predicts the most frequent class.",a:true,e:"The empirical risk is minimized by choosing the class with the highest count, i.e., the mode of the response values.",s:"Slide 4-12 (Risk Min. II)"},
{ch:"4",t:"The Bayes classifier for the 0-1-loss assigns each point x to the most probable class according to the posterior distribution.",a:true,e:"ĥ(x) = argmax_l P(y=l|x) — predict the most probable class.",s:"Slide 4-5 (Risk Min. II)"},
{ch:"4",t:"The Bayes error rate is the minimum achievable expected loss for the 0-1-loss, assuming perfect knowledge of P_xy.",a:true,e:"The Bayes classifier achieves the minimum possible expected 0-1-loss — the Bayes error rate. No classifier can do better on average.",s:"Slide 4-5 (Risk Min. II)"},
{ch:"4",t:"The 0-1-loss corresponds to a cost matrix with zeros on the diagonal and ones everywhere else.",a:true,e:"For 0-1-loss, the cost matrix has 0 on the diagonal (correct predictions) and 1 everywhere off-diagonal (all misclassifications equally penalized).",s:"Slide 4-4 (Risk Min. II)"},
{ch:"4",t:"The binary Brier score is the squared difference between the predicted probability π(x) and the true binary outcome y.",a:true,e:"L(y, π(x)) = (π(x) − y)² for y ∈ {0,1}. This is the L2-loss applied to probabilities.",s:"Slide 4-13 (Risk Min. II)"},
{ch:"4",t:"The Brier score is a proper scoring rule, meaning the true predictive distribution achieves the minimum expected loss.",a:true,e:"A proper scoring rule incentivizes reporting honest, calibrated probabilities. If you know the true π(x), reporting it minimizes E[L].",s:"Slide 4-13 (Risk Min. II)"},
{ch:"4",t:"The optimal constant model for the Brier score is the proportion of class-1 observations in the training data.",a:true,e:"Minimizing Σ(y^(i) − θ)² gives θ̂ = (1/n)Σy^(i), the sample proportion of class-1 observations.",s:"Slide 4-15 (Risk Min. II)"},
{ch:"4",t:"For multiclass classification with g classes, the Brier score sums squared differences across all g class probabilities.",a:true,e:"The multiclass Brier score is L(y, f(x)) = Σ_{k=1}^g (1{y=k} − π_k(x))².",s:"Slide 4-16 (Risk Min. II)"},
{ch:"4",t:"The Bernoulli loss is derived from the negative log-likelihood under the assumption that y is Bernoulli distributed.",a:true,e:"If y^(i) ~ Bernoulli(π(x^(i))), negating the log-likelihood gives the Bernoulli loss: L = −y log(π(x)) − (1−y) log(1−π(x)).",s:"Slide 4-19 (Risk Min. II)"},
{ch:"4",t:"The Bernoulli loss is also known as the logarithmic loss or cross-entropy loss.",a:true,e:"All three names refer to the same loss function: L = −y log(π) − (1−y) log(1−π).",s:"Slide 4-20 (Risk Min. II)"},
{ch:"4",t:"The optimal constant model for the Bernoulli loss predicts the fraction of class-1 observations in the data.",a:true,e:"Differentiating and setting to zero gives θ̂ = (1/n)Σy^(i), the empirical class-1 proportion.",s:"Slide 4-21 (Risk Min. II)"},
{ch:"4",t:"The multiclass logarithmic loss for g classes is L(y, f(x)) = −Σ_{k=1}^g 1{y=k} log(π_k(x)).",a:true,e:"Since only the indicator for the true class is nonzero, this simplifies to L = −log(π_{y}(x)).",s:"Slide 4-22 (Risk Min. II)"},
{ch:"4",t:"The exponential loss L(y, f(x)) = exp(−y·f(x)) is used in the AdaBoost algorithm.",a:true,e:"AdaBoost minimizes the sum of exponential losses over training data. The exponential weighting drives AdaBoost to focus intensely on hard-to-classify examples.",s:"Slide 4-17 (Risk Min. II)"},
{ch:"4",t:"The exponential loss is convex and differentiable, making it easier to optimize than the 0-1-loss.",a:true,e:"exp(−y·f(x)) is infinitely differentiable and strictly convex. It serves as a smooth, convex upper bound on the 0-1-loss.",s:"Slide 4-17 (Risk Min. II)"},
{ch:"4",t:"Even correct predictions with high confidence still incur a positive exponential loss.",a:true,e:"For a correctly classified point with margin y·f(x) = M > 0, the loss is exp(−M) > 0 for all finite M. The exponential loss only reaches zero asymptotically.",s:"Slide 4-17 (Risk Min. II)"},
{ch:"4",t:"The logistic sigmoid function maps any real-valued score f(x) ∈ ℝ to a probability in (0, 1).",a:true,e:"The logistic function s(f(x)) = 1/(1 + exp(−f(x))) is strictly between 0 and 1 for all finite f(x).",s:"Slide 4-24 (Risk Min. II)"},
{ch:"4",t:"The logistic loss L(y, f(x)) = log(1 + exp(−y·f(x))) for y ∈ {−1, +1} is equivalent to the Bernoulli loss when scores are passed through the logistic sigmoid.",a:true,e:"These two losses are equivalent when the logistic transformation links scores to probabilities.",s:"Slide 4-24 & 4-25 (Risk Min. II)"},
{ch:"4",t:"Using f(x) = θ_0 + θ^⊤x in the logistic loss setup leads to logistic regression.",a:true,e:"When f(x) = θ_0 + θ^⊤x and the loss is the logistic loss, the resulting ERM problem defines logistic regression.",s:"Slide 4-25 (Risk Min. II)"},
{ch:"4",t:"The logistic loss is robust to outliers, since it saturates for large negative margins.",a:false,e:"The logistic loss does not saturate — it grows linearly for large negative margins. It is not robust in the same way as Huber or L1-loss.",s:"Slide 4-26 (Risk Min. II)"},
{ch:"4",t:"The minimizer of the theoretical risk under logistic loss is f̂(x) = log[P(y|x) / (1 − P(y|x))], the log-odds.",a:true,e:"Minimizing the expected logistic loss yields f̂(x) = log[P(y=1|x) / P(y=0|x)], the log-odds (logit) of the conditional probability of class 1.",s:"Slide 4-27 (Risk Min. II)"},
{ch:"4",t:"The cross-entropy loss is equivalent to the logistic loss when scores are transformed to probabilities by the logistic function.",a:true,e:"Cross-entropy, Bernoulli loss, and logistic loss are three perspectives on the same loss. They are all equivalent when the logistic sigmoid is used.",s:"Slide 4-28 (Risk Min. II)"},
{ch:"4",t:"Ordinary linear regression corresponds to empirical risk minimization with the L2 (squared) loss.",a:true,e:"OLS minimizes Σ(y^(i) − f(x^(i)|θ))², which is exactly the empirical L2-risk for a linear model.",s:"Slide 4-29 (Risk Min. II)"},
{ch:"4",t:"Support Vector Machines for classification use the hinge loss, which does not correspond to any standard probability distribution.",a:true,e:"The hinge loss L = max(0, 1 − y·f(x)) is one of the prominent examples of a loss that cannot be derived from a probability distribution.",s:"Slide 4-29 (Risk Min. II)"},
{ch:"4",t:"AdaBoost uses the logistic loss, while logistic regression uses the exponential loss.",a:false,e:"It's the other way around: AdaBoost uses the exponential loss, while logistic regression uses the logistic loss.",s:"Slide 4-29 (Risk Min. II)"},
{ch:"4",t:"Support Vector Regression (SVR) uses the ε-insensitive loss.",a:true,e:"SVR minimizes a combination of model complexity and the ε-insensitive loss, ignoring prediction errors below ε.",s:"Slide 4-29 (Risk Min. II)"},
{ch:"4",t:"A loss function that is convex in the residual r is automatically convex in the parameters θ for any model class f(x|θ).",a:false,e:"Convexity in r does not automatically transfer to convexity in θ. The composition L(y, f(x|θ)) is convex in θ only if f(x|θ) is also linear in θ.",s:"Slide 4-15 (Risk Min. I)"},
{ch:"4",t:"Fitting a model with the L1-loss tends to produce residuals that are concentrated near zero with occasional larger values.",a:true,e:"L1-loss (corresponding to Laplace errors) produces residuals that are sharply peaked at zero with heavier tails — the hallmark of a Laplace distribution.",s:"Slide 4-51 (Risk Min. I)"},
{ch:"4",t:"The hinge loss (used in SVMs) corresponds to the negative log-likelihood of a Gaussian distribution.",a:false,e:"The Gaussian distribution corresponds to the L2-loss. The hinge loss does NOT correspond to any standard probability distribution.",s:"Slide 4-48 (Risk Min. I)"},
{ch:"4",t:"For the L1-loss L(y, f(x)) = |y − f(x)|, the pseudo-residual is sign(y − f(x)).",a:true,e:"The pseudo-residual is r̃ = −∂|r|/∂f. Since ∂|y−f|/∂f = −sign(r), we get r̃ = sign(y − f(x)).",s:"Slide 4-7 & 4-21 (Risk Min. I)"},
{ch:"4",t:"Pseudo-residuals are always equal in magnitude to the ordinary residuals, regardless of which loss function is used.",a:false,e:"Only L2 has pseudo-residuals equal to ordinary residuals. For L1: r̃ = sign(r) ∈ {−1,+1}. For Huber: r̃ = r if |r| ≤ δ, else δ·sign(r).",s:"Slide 4-7 (Risk Min. I)"},
{ch:"4",t:"The Pseudo-residual of the Huber loss equals y − f(x) when |r| > δ.",a:false,e:"For |r| > δ, the Huber loss is linear: L = δ|r| − δ²/2. The pseudo-residual is r̃ = δ · sign(y − f(x)), not the full residual.",s:"Slide 4-34 (Risk Min. I)"},
{ch:"4",t:"Quantile regression with α = 0.9 produces a model that predicts the 90th percentile of y given x.",a:true,e:"The quantile loss with parameter α targets the α-th conditional quantile Q_α(y|x). Setting α = 0.9 targets the 90th percentile.",s:"Slide 4-26 (Risk Min. I)"},
{ch:"4",t:"The quantile loss with α > 0.5 penalizes over-prediction (f(x) > y) more than under-prediction.",a:false,e:"With α > 0.5, under-prediction (y ≥ f(x)) is penalized more heavily (factor α), while over-prediction has factor (1−α) < 0.5. So α > 0.5 penalizes under-prediction more.",s:"Slide 4-24 (Risk Min. I)"},
{ch:"4",t:"The Huber loss is differentiable everywhere because the quadratic and linear pieces are joined with a continuous first derivative at |r| = δ.",a:true,e:"At |r| = δ: the derivative of (1/2)r² is r = δ, and the derivative of δ|r| − δ²/2 is δ·sign(r) = δ. These match exactly, so Huber is C¹.",s:"Slide 4-28 (Risk Min. I)"},
{ch:"4",t:"With Huber loss (δ → 0), the fitted model converges to the same solution as L2 loss.",a:false,e:"As δ → 0, the Huber loss becomes entirely linear (like L1), converging to the L1 solution (sample median). As δ → ∞, it converges to L2.",s:"Slide 4-29 (Risk Min. I)"},
{ch:"4",t:"The decision boundary of a binary scoring classifier is where f(x) = 0.",a:true,e:"Since h(x) = sign(f(x)), the boundary between predicting +1 and −1 is where sign(f(x)) switches, i.e., where f(x) = 0.",s:"Slide 4-9 (Risk Min. II)"},
{ch:"4",t:"Hard labels can always be converted into class probabilities without loss of information.",a:false,e:"Converting class probabilities to hard labels (via argmax) loses information. A hard label y = 1 is consistent with π(x) = 0.51 or π(x) = 0.99.",s:"Slide 4-8, Quiz Solution p.3 (Risk Min. II)"},
{ch:"4",t:"A probabilistic classifier that always predicts π(x) = 0.5 achieves a Brier score of 0.25 regardless of the true labels.",a:true,e:"For any y ∈ {0,1}: L = (0.5 − y)² = 0.25. So the empirical Brier score for a constant 0.5 predictor is always exactly 0.25.",s:"Slide 4-13 & 4-14 (Risk Min. II)"},
{ch:"4",t:"The logistic loss approaches 0 as the margin y·f(x) → +∞, but never reaches 0 for any finite score.",a:true,e:"L = log(1 + exp(−y·f(x))). As y·f(x) → +∞, exp(−y·f(x)) → 0, so L → log(1) = 0. But for any finite margin, L > 0.",s:"Slide 4-26 (Risk Min. II)"},
{ch:"4",t:"The exponential loss penalizes misclassified observations much more severely than the logistic loss for large negative margins.",a:true,e:"For large negative margin m → −∞: exponential loss = exp(−m) → ∞ exponentially, while logistic loss ≈ −m grows only linearly.",s:"Slide 4-17 (Risk Min. II)"},
{ch:"4",t:"The Bernoulli loss is undefined when the predicted probability π(x) = 0 and the true label y = 1.",a:true,e:"L = −y log(π(x)). When y = 1 and π(x) = 0: L = −1·log(0) = +∞. This represents an infinite penalty for being perfectly wrong.",s:"Slide 4-20 (Risk Min. II)"},
{ch:"4",t:"A proper scoring rule incentivizes the forecaster to predict the true underlying probability distribution honestly.",a:true,e:"A scoring rule S(π, y) is proper if the expected score is minimized when π equals the true distribution. Proper rules discourage hedging strategies.",s:"Slide 4-13 (Risk Min. II)"},
{ch:"4",t:"The 0-1-loss is a proper scoring rule for probabilistic classifiers.",a:false,e:"The 0-1-loss is not a proper scoring rule. It does not incentivize predicting calibrated probabilities. Proper scoring rules (Brier score, log-loss) reward accurate probability estimates.",s:"Slide 4-13 (Risk Min. II)"},
{ch:"4",t:"The empirical risk evaluated on training data is always a biased (optimistic) estimate of the true generalization error.",a:true,e:"The training error is minimized during model fitting, so R_emp on training data underestimates R(f). This optimism grows with model complexity.",s:"Slide 4-13 (Risk Min. I)"},
{ch:"4",t:"Knowing the optimal constant model for a loss function tells us what the loss implicitly assumes about the target distribution.",a:true,e:"The optimal constant reveals the loss's 'target statistic': L2 targets E[y] (mean), L1 targets Q_{0.5}(y) (median), quantile loss targets Q_α(y), Brier score targets P(y=1).",s:"Slides 4-19, 4-22, 4-26 (Risk Min. I)"},
{ch:"4",t:"All of the regression losses discussed (L1, L2, Huber, quantile, ε-insensitive) are convex functions of the residual.",a:true,e:"All five are convex in r = y − f(x): L2 (quadratic), L1 (absolute value), Huber (piecewise), quantile (piecewise linear), ε-insensitive (piecewise linear).",s:"Slide 4-44 (Risk Min. I)"},
{ch:"4",t:"The log-barrier loss is the only regression loss discussed that can make the risk minimization problem infeasible.",a:true,e:"If the optimal model necessarily produces residuals exceeding a, the minimum of R_emp is +∞. All other losses are finite for any finite prediction.",s:"Slide 4-43 (Risk Min. I)"},
{ch:"4",t:"The multiclass logarithmic loss is not sensitive to the probabilities assigned to incorrect classes, only to the probability assigned to the true class.",a:true,e:"L = −log(π_y(x)) depends only on π_y(x). However, since probabilities must sum to 1, there is an indirect coupling through the softmax constraint.",s:"Slide 4-22 (Risk Min. II)"},
{ch:"4",t:"Logistic regression minimizes the logistic loss (or equivalently, Bernoulli loss with logistic link) over a linear hypothesis space.",a:true,e:"Logistic regression is defined by: (1) f(x) = θ_0 + θ^⊤x; (2) π(x) = sigmoid(f(x)); (3) ERM with Bernoulli/logistic loss.",s:"Slide 4-25 (Risk Min. II)"},
{ch:"4",t:"The noise model ε ~ N(0, σ²) implies that y | x ~ N(f_true(x), σ²).",a:true,e:"If y = f_true(x) + ε and ε ~ N(0, σ²) independently of x, then y | x ~ N(f_true(x), σ²). This is the standard Gaussian noise model underlying OLS.",s:"Slide 4-46 (Risk Min. I)"},
{ch:"4",t:"If the errors follow a Gaussian distribution N(0, σ²), increasing σ changes the optimal parameter estimate θ̂ under MLE.",a:false,e:"The MLE for Gaussian errors minimizes Σ(y^(i) − f(x^(i)|θ))²/(2σ²). Since σ² is a positive constant, it cancels out in the minimization. θ̂ is unchanged.",s:"Slide 4-49 (Risk Min. I)"},
{ch:"4",t:"The MLE perspective provides a principled way to choose a loss function: assume a noise model, then derive the corresponding loss as the negative log-likelihood.",a:true,e:"The recipe: (1) choose an error distribution; (2) derive p(y|x,θ); (3) the loss is −log p(y|x,θ). Gaussian → L2, Laplace → L1, Bernoulli → cross-entropy.",s:"Slide 4-47 & 4-48 (Risk Min. I)"},
{ch:"4",t:"In gradient descent, the step size α^[j] (learning rate) must be chosen carefully: too large leads to divergence, too small leads to very slow convergence.",a:true,e:"The step size controls the trade-off between speed and stability. If α is too large, the update overshoots and may diverge. If too small, each update makes negligible progress.",s:"Slide 4-32 (Risk Min. I)"},
{ch:"4",t:"For the constant model f(x) = θ with L2-loss, gradient descent converges in a single step to the sample mean.",a:false,e:"Gradient descent is iterative. The L2 loss for a constant model has a closed-form solution ȳ, which is why we can directly jump to it analytically instead of using gradient descent.",s:"Slide 4-32 (Risk Min. I)"},
{ch:"4",t:"SGD's parameter sequence {θ^[1], θ^[2], ...} is stochastic because each step uses a randomly drawn training observation.",a:true,e:"In SGD, observation i is drawn randomly at each step, making the gradient estimate random and the entire sequence of parameters a stochastic process.",s:"Slide 4-39 (Risk Min. I)"},

/* ──────────────────────── CHAPTER 5 — LINEAR MODELS (165 questions) ──────────────────────── */
{ch:"5L",t:"The hypothesis space of univariate linear models H = {f(x) = θ₀ + θ₁x | θ₀, θ₁ ∈ ℝ} can represent any curve including parabolas.",a:false,e:"The univariate linear hypothesis space only contains straight lines — functions linear in x. Parabolas require polynomial terms (x²) and belong to a different, more expressive hypothesis space.",s:"Slide 5"},
{ch:"5L",t:"Minimizing the empirical risk under L2 loss for a univariate linear model requires numerical optimization methods like gradient descent.",a:false,e:"The L2 loss is differentiable and the resulting empirical risk minimization problem is convex. Setting partial derivatives to zero yields closed-form analytical solutions.",s:"Slides 7–8"},
{ch:"5L",t:"The optimal intercept θ̂₀ under L2 loss satisfies θ̂₀ = ȳ − θ̂₁x̄, meaning the regression line always passes through (x̄, ȳ).",a:true,e:"Plugging x = x̄ into ŷ = θ̂₀ + θ̂₁x gives ŷ = ȳ. The OLS line passes exactly through the point of means (x̄, ȳ).",s:"Slide 8"},
{ch:"5L",t:"The optimal slope θ̂₁ in univariate linear regression equals the sample correlation ρ_xy multiplied by s_y / s_x.",a:true,e:"From the closed-form: θ̂₁ = ρ_xy · (s_y / s_x). The slope depends on how strongly x and y co-vary and on the ratio of their spreads.",s:"Slides 8–9"},
{ch:"5L",t:"If ρ_xy = 0, the best-fitting linear model under L2 loss predicts the mean of y for all x.",a:true,e:"Since θ̂₁ = ρ_xy · s_y/s_x = 0, the model reduces to ŷ = ȳ — the constant baseline.",s:"Slides 8–9"},
{ch:"5L",t:"The sample correlation coefficient ρ_xy measures nonlinear association between x and y.",a:false,e:"Pearson correlation captures only linear association. Variables can have strong nonlinear relationships with ρ_xy ≈ 0.",s:"Slide 9"},
{ch:"5L",t:"R² compares the SSE of the fitted linear model to the SSE of the constant model c(x) = ȳ.",a:true,e:"R² = 1 − Remp(θ)/Remp(c). It quantifies how much better the linear model is compared to predicting the mean.",s:"Slides 10–12"},
{ch:"5L",t:"R² = 1 means perfect fit (all residuals zero); R² = 0 means the model predicts no better than c(x) = ȳ.",a:true,e:"R² = 1 − SSE_model/SSE_constant. Zero numerator gives R² = 1; equal SSEs give R² = 0.",s:"Slide 13"},
{ch:"5L",t:"On training data, R² always lies in [0, 1].",a:true,e:"The linear model minimises the same loss over a larger space than the constant, so it can never do worse: R² ≥ 0. And SSE_model ≥ 0 ensures R² ≤ 1.",s:"Slide 13"},
{ch:"5L",t:"R² can be negative when evaluated on test data.",a:true,e:"On unseen test data the linear model may generalise worse than ȳ, making SSE_model > SSE_constant and R² < 0.",s:"Slide 13"},
{ch:"5L",t:"In univariate linear regression R² = ρ²_xy.",a:true,e:"Substituting the estimated linear model into the R² formula and simplifying using the definitions yields exactly R² = ρ²_xy.",s:"Slides 14–15"},
{ch:"5L",t:"R² is only meaningful for L2 loss and the linear model.",a:false,e:"1 − Remp(f)/Remp(c) can be used for any model f, baseline c, and loss function.",s:"Slide 16"},
{ch:"5L",t:"The linear model with L1 loss estimates the conditional median of y given x.",a:true,e:"Minimising mean absolute error is equivalent to estimating the median.",s:"Slide 17"},
{ch:"5L",t:"The L1 loss is differentiable everywhere, enabling a closed-form OLS-style solution.",a:false,e:"L1 has a kink at the residual zero, preventing closed-form calculus solutions.",s:"Slide 17"},
{ch:"5L",t:"The Huber loss behaves quadratically for small residuals and linearly for large residuals.",a:true,e:"Huber loss = (1/2)r² for |r| ≤ δ (smooth like L2) and δ|r|−δ²/2 for |r| > δ (robust like L1).",s:"Slide 18"},
{ch:"5L",t:"L1 loss is more robust to outliers than L2 loss.",a:true,e:"L2 squares residuals so outliers dominate. L1 grows only linearly, giving outliers proportionally less influence.",s:"Slides 19–20"},
