{ch:"5L",t:"L2, L1, and Huber losses always produce the same fitted model when there are no outliers.",a:false,e:"They optimize different objectives (mean, median, hybrid) and generally produce different estimates even without outliers.",s:"Slides 19–20"},
{ch:"5L",t:"In multivariate regression a column of ones is prepended to X so that the intercept is absorbed into θ.",a:true,e:"Augmenting x with a leading 1 lets f(x) = θᵀx encode the intercept as the first component of θ.",s:"Slide 21"},
{ch:"5L",t:"The normal equations Xᵀ(y − Xθ) = 0 are obtained by differentiating the multivariate L2 loss w.r.t. θ.",a:true,e:"Differentiating (y−Xθ)ᵀ(y−Xθ) and setting to zero yields Xᵀ(y−Xθ) = 0, solved by θ̂ = (XᵀX)⁻¹Xᵀy.",s:"Slide 22"},
{ch:"5L",t:"The OLS estimator θ̂ = (XᵀX)⁻¹Xᵀy exists for any design matrix X.",a:false,e:"(XᵀX)⁻¹ requires full column rank. With linear dependencies among features or n < p, the matrix is singular.",s:"Slide 22"},
{ch:"5L",t:"Polynomial regression of degree d can be fitted with the standard OLS formula by using powers of x as features.",a:true,e:"The design matrix with columns [1, x, x², …, xᵈ] makes polynomial regression linear in θ, so θ̂ = (XᵀX)⁻¹Xᵀy applies directly.",s:"Slide 26"},
{ch:"5L",t:"Increasing polynomial degree d always improves generalisation to new data.",a:false,e:"Beyond a point, higher d fits noise rather than signal (overfitting) and causes edge oscillations, degrading generalisation.",s:"Slides 28–29"},
{ch:"5L",t:"High-degree polynomials can oscillate strongly near the boundaries of the input domain.",a:true,e:"This is Runge's phenomenon: high-degree polynomials fitted to interior data exhibit large oscillations at domain edges.",s:"Slides 28–29"},
{ch:"5L",t:"Polynomial regression is a special case of multivariate linear regression with features φ(x) = (1, x, x², …, xᵈ).",a:true,e:"The model is linear in θ (the parameters) even though it is non-linear in x. The feature transformation makes it a standard multivariate linear regression.",s:"Slides 25–26"},
{ch:"5L",t:"Piecewise polynomials divide the domain into K intervals using K−1 interior knots and fit a separate degree-d polynomial on each.",a:true,e:"K intervals separated by K−1 knots, each fitted with an independent polynomial of degree d. Total parameters: K(d+1).",s:"Slide 30"},
{ch:"5L",t:"A piecewise constant model (d=0) with L2 loss predicts the mean of y within each interval.",a:true,e:"The optimal constant minimizing Σ(y−c)² within a region is the mean. Piecewise constant = histogram estimator.",s:"Slide 31"},
{ch:"5L",t:"Piecewise polynomial models automatically guarantee continuity at the knots.",a:false,e:"Without additional constraints each piece is independent, allowing jumps at knots. Continuity must be explicitly enforced, leading to splines.",s:"Slide 36"},
{ch:"5L",t:"Regression splines add continuity constraints at knots, reducing the total number of free parameters.",a:true,e:"Each continuity constraint removes one degree of freedom. The truncated power basis encodes these constraints algebraically.",s:"Slides 36–39"},
{ch:"5L",t:"For a linear spline (d=1) with one knot ζ₁, the basis is b₁=1, b₂=x, b₃=(x−ζ₁)₊.",a:true,e:"The truncated power basis with (x−ζ₁)₊ = max(x−ζ₁, 0) ensures the two pieces join continuously at ζ₁.",s:"Slides 37–38"},
{ch:"5L",t:"(x−ζ)ᵈ₊ = 0 for x ≤ ζ and (x−ζ)ᵈ for x > ζ.",a:true,e:"By definition (x)₊ = max(x,0), so (x−ζ)ᵈ₊ activates only beyond the knot.",s:"Slide 39"},
{ch:"5L",t:"Fixed-knot splines are regression splines; data-adaptive penalised splines are smoothing splines.",a:true,e:"Regression splines specify knots in advance. Smoothing splines place knots at every data point and control complexity via a curvature penalty λ.",s:"Slides 40, 45"},
{ch:"5L",t:"Cubic splines are the lowest-order splines where non-smoothness at knots is invisible to the human eye.",a:true,e:"C² continuity is the minimum needed to suppress visible non-smoothness. Higher orders add cost without perceptual benefit.",s:"Slide 42"},
{ch:"5L",t:"A cubic spline with knots ζ₁, ζ₂ has exactly six basis functions: 1, x, x², x³, (x−ζ₁)³₊, (x−ζ₂)³₊.",a:true,e:"The truncated power cubic basis has 4 global terms plus one per interior knot, giving 4+2=6 parameters.",s:"Slide 42"},
{ch:"5L",t:"Going beyond cubic splines is generally recommended for smoother predictions.",a:false,e:"Cubic splines already achieve C² smoothness, which is visually indistinguishable from higher-order smoothness.",s:"Slide 42"},
{ch:"5L",t:"Natural cubic splines add the constraint that the function is linear beyond the boundary knots.",a:true,e:"This constraint suppresses erratic extrapolation at the domain boundaries and reduces free parameters by 2.",s:"Slide 44"},
{ch:"5L",t:"A natural cubic spline with K knots has fewer free parameters than an unrestricted cubic spline with the same knots.",a:true,e:"The boundary linearity constraints eliminate 2 degrees of freedom. The natural spline has K parameters vs K+3 for the cubic spline.",s:"Slide 44"},
{ch:"5L",t:"In smoothing splines, λ=0 corresponds to ordinary linear regression.",a:false,e:"λ=0 means no penalty, so the function interpolates all data points. λ→∞ forces f''=0 everywhere, which is linear regression.",s:"Slide 45"},
{ch:"5L",t:"The minimiser of the smoothing spline penalised objective is a natural cubic spline with knots at every data point.",a:true,e:"A key theoretical result: among all functions with two continuous derivatives, the unique minimiser is a natural cubic spline with knots at x(1),…,x(n).",s:"Slide 46"},
{ch:"5L",t:"The optimal λ for a smoothing spline can be chosen by cross-validation.",a:true,e:"Cross-validation evaluates predictive performance for different λ values and selects the one minimising estimated generalisation error.",s:"Slide 47"},
{ch:"5L",t:"The smoothing spline penalty λ∫[f''(t)]²dt penalises the first derivative of f.",a:false,e:"It penalises the squared second derivative (curvature), not the first. Penalising curvature discourages wiggly functions.",s:"Slide 45"},
{ch:"5L",t:"A regression stump partitions input space into exactly two regions and makes a constant prediction in each.",a:true,e:"A regression stump has a single split: observations with x_j ≤ t go to node N₁ with prediction c₁, and observations with x_j > t go to node N₂ with prediction c₂.",s:"Slides 48–50"},
{ch:"5L",t:"For a regression stump with L2 loss, the optimal constant in each leaf is the mean of y in that leaf.",a:true,e:"Minimising Σ(y − c)² gives c* = ȳ_N, the mean of responses in node N.",s:"Slide 52"},
{ch:"5L",t:"For a regression stump with L1 loss, the optimal constant prediction is the mean of y in that node.",a:false,e:"L1 loss is minimised by the median, not the mean.",s:"Slide 53"},
{ch:"5L",t:"A regression stump is a regression tree with exactly one split.",a:true,e:"A regression tree built with a single recursive split on the root node is a stump.",s:"Slide 50"},
{ch:"5L",t:"Finding the optimal split in a regression stump requires exhaustive search over all feature-threshold combinations.",a:true,e:"There is no closed form for the optimal split. All features j and all candidate thresholds t are evaluated.",s:"Slide 51"},
{ch:"5L",t:"Recursively splitting regression stump nodes produces a regression tree.",a:true,e:"Applying the same splitting criterion recursively to leaf nodes generates a full regression tree.",s:"Slide 54"},
{ch:"5L",t:"Decision stumps predict constant class probability vectors in each of their two leaf nodes.",a:true,e:"A decision stump outputs a constant g-vector of class probabilities per leaf.",s:"Slides 56–58"},
{ch:"5L",t:"Under Brier score, the optimal constant prediction in a decision stump node is the vector of empirical class proportions.",a:true,e:"The Brier score Σ_k(1_{y=k}−π_k)² is minimised by π̂_k = n_{N,k}/|N|, the class proportions.",s:"Slide 58"},
{ch:"5L",t:"Gini impurity splitting is equivalent to risk minimisation w.r.t. the Brier score.",a:true,e:"The lecture proves R(N) = |N|·I_Gini(N), so minimising R(N₁)+R(N₂) equals maximising weighted Gini impurity reduction.",s:"Slides 61–63"},
{ch:"5L",t:"Entropy-based splitting is equivalent to risk minimisation w.r.t. the log loss.",a:true,e:"R(N) = |N|·(−Σ_k π_k log π_k) = |N|·I_Entropy(N).",s:"Slides 64–65"},
{ch:"5L",t:"The Gini impurity of a perfectly pure node (all one class) is zero.",a:true,e:"If π_k=1 for one class and 0 for others, I = Σ_k π_k(1−π_k) = 0.",s:"Slide 60"},
{ch:"5L",t:"The entropy impurity is always numerically larger than the Gini impurity for the same node.",a:false,e:"The two measures have different scales and there is no universal inequality between them.",s:"Slide 60"},
{ch:"5L",t:"Stumps and trees with entropy splitting use the same loss as logistic regression but differ in hypothesis space.",a:true,e:"Both use log loss. Logistic regression uses linear functions; stumps use step (piecewise constant) functions.",s:"Slide 65"},
{ch:"5L",t:"Logistic regression uses a linear hypothesis space combined with the logistic loss L(y,f(x)) = log(1+exp(−yf(x))).",a:true,e:"This is the standard logistic regression formulation: f(x)=θᵀx is the score; the logistic loss penalises misclassified margins.",s:"Slide 66"},
{ch:"5L",t:"The logistic sigmoid s(z) = 1/(1+exp(−z)) maps ℝ to (0,1).",a:true,e:"s(z) is strictly positive and strictly less than 1 for all finite z, mapping the real line to the open interval (0,1).",s:"Slide 66"},
{ch:"5L",t:"Logistic regression can equivalently minimise the Bernoulli loss −y log π(x) − (1−y) log(1−π(x)).",a:true,e:"Substituting π(x) = σ(θᵀx) into the Bernoulli loss recovers the logistic loss.",s:"Slide 67"},
{ch:"5L",t:"The decision boundary of logistic regression is the hyperplane f(x) = θᵀx = 0.",a:true,e:"π(x) = 0.5 when f(x) = 0 (sigmoid at zero). Points on this hyperplane are equally likely under both classes.",s:"Slides 71–72"},
{ch:"5L",t:"The discriminant function f(x) = θᵀx can be interpreted as log(π(x)/(1−π(x))), the log-odds ratio.",a:true,e:"Applying the logit transformation to π(x) = σ(θᵀx) recovers f(x). The linear score equals the log-odds.",s:"Slides 71–72"},
{ch:"5L",t:"Logistic regression always has a unique bounded solution regardless of the training data.",a:false,e:"On linearly separable data the logistic loss never reaches zero, and scaling θ by c>1 strictly reduces the loss, so no finite minimum exists.",s:"Slides 75–79"},
{ch:"5L",t:"Scaling logistic regression parameters θ by c>1 reduces empirical risk when data is linearly separable.",a:true,e:"Separability means y(i)(θᵀx(i))>0 for all i. Scaling to cθ increases all margins, and since logistic loss decreases with margin, each loss term decreases.",s:"Slides 77–78"},
{ch:"5L",t:"Hinge loss, which reaches exactly zero for sufficiently large margins, solves the unbounded logistic regression problem on separable data.",a:true,e:"Hinge loss = max(0, 1−yf(x)) = 0 when yf(x) ≥ 1. The optimal solution can achieve zero loss at finite θ.",s:"Slide 80"},
{ch:"5L",t:"Adding regularisation λ||θ||² prevents the unbounded optimisation problem in logistic regression on separable data.",a:true,e:"The penalty grows without bound as ||θ||→∞, counteracting the gain from increasing the margin, ensuring a finite minimum.",s:"Slide 80"},
{ch:"5L",t:"Logistic regression's decision boundary in input space is always nonlinear.",a:false,e:"The boundary f(x)=θᵀx=0 is always a linear (affine) hyperplane.",s:"Slides 71–73"},
{ch:"5L",t:"A hyperplane in ℝᵖ is a (p−1)-dimensional subspace.",a:true,e:"One linear constraint reduces dimension by one: a hyperplane in ℝᵖ is (p−1)-dimensional.",s:"Slide 73"},
{ch:"5L",t:"The distance from point x to hyperplane f(x)=θᵀx+θ₀=0 is |f(x)|/||θ||.",a:true,e:"Standard formula for point-to-hyperplane distance. Simplifies to |f(x)| when ||θ||=1.",s:"Slide 74"},
{ch:"5L",t:"For ||θ||=1, the distance from the origin to the hyperplane θᵀx+θ₀=0 equals |θ₀|.",a:true,e:"Setting x=0: d = |θ₀|/1 = |θ₀|. The intercept term has a direct geometric meaning.",s:"Slide 74"},
{ch:"5L",t:"The positive halfspace {x: f(x)>0} is the side the normal vector θ points toward.",a:true,e:"θ is the normal vector pointing into the positive halfspace by convention.",s:"Slide 74"},
{ch:"5L",t:"All model classes in Chapter 5 serve as building blocks for ensemble methods like boosting and bagging.",a:true,e:"The chapter explicitly states these simple model classes are studied both for risk minimisation understanding and as components of stronger ensemble models.",s:"Slide 2"},
{ch:"5L",t:"Minimising empirical risk unifies all model fitting procedures in Chapter 5.",a:true,e:"OLS, splines, stumps, logistic regression — all minimise an average loss over training data.",s:"Slides 2–3"},
{ch:"5L",t:"The choice of loss function does not affect which model in the hypothesis space is selected.",a:false,e:"Loss function determines what is estimated: L2→mean, L1→median, pinball→quantile. Different losses select fundamentally different models.",s:"Slides 17, 53"},
{ch:"5L",t:"Splines combine global smoothness of polynomials with local flexibility of piecewise polynomials.",a:true,e:"Polynomials are globally smooth but inflexible locally. Piecewise polynomials are locally flexible but can be discontinuous. Splines enforce continuity, achieving both.",s:"Slides 25–40"},
{ch:"5L",t:"Logistic regression creates convex decision regions separated by a hyperplane.",a:true,e:"Halfspaces (regions on each side of a hyperplane) are convex. Logistic regression's linear boundary creates exactly two convex decision regions.",s:"Slides 71–72"},
{ch:"5L",t:"A decision stump's split condition x_j ≤ t always creates an axis-aligned boundary.",a:true,e:"Thresholding a single feature creates a hyperplane perpendicular to that coordinate axis — always axis-aligned, unlike logistic regression.",s:"Slides 48–50"},
{ch:"5L",t:"Polynomial degree d=1 has higher bias and lower variance than degree d=10.",a:true,e:"Low capacity (d=1) systematically misses curves (high bias) but is stable across datasets (low variance). High capacity (d=10) fits noise (high variance) but can model complex curves.",s:"Slides 28–29"},
{ch:"5L",t:"The empirical risk for the univariate linear model with L2 loss is a convex function of (θ₀, θ₁), guaranteeing a global minimum.",a:true,e:"The L2 empirical risk is a sum of squared affine functions in (θ₀,θ₁), which is a convex quadratic. Convex functions have no local minima other than the global one.",s:"Slide 7"},
{ch:"5L",t:"The correlation coefficient ρ_xy always lies in [−1, 1].",a:true,e:"By the Cauchy-Schwarz inequality, |ρ_xy| ≤ 1. Values ±1 correspond to perfect linear relationships.",s:"Slide 9"},
{ch:"5L",t:"For a regression task, the empirical risk R_emp(f) always equals the theoretical risk R(f) when evaluated on the training data.",a:false,e:"R_emp is an approximation of R — they are equal only asymptotically as n → ∞. For finite training sets, R_emp is a biased-low estimate of R.",s:"Slide 13"},
{ch:"5L",t:"In multivariate OLS, the design matrix X has dimensions n × (p+1) when the intercept column is included.",a:true,e:"X has n rows (one per observation) and p+1 columns (one per feature plus the intercept column of ones).",s:"Slide 21"},
{ch:"5L",t:"A polynomial model of degree d has exactly d+1 free parameters (including the intercept).",a:true,e:"The model θ₀+θ₁x+…+θ_d x^d has coefficients θ₀,θ₁,…,θ_d — that is d+1 parameters.",s:"Slide 25"},
{ch:"5L",t:"Polynomial regression is a linear model because it is linear in the parameters, even though it is non-linear in x.",a:true,e:"'Linear model' in statistics refers to linearity in the parameters θ, not in the predictors.",s:"Slides 25–26"},
{ch:"5L",t:"For polynomial regression, a higher degree always reduces training error.",a:true,e:"A higher-degree polynomial can always fit the training data at least as well as a lower-degree one (the lower-degree model is a special case). Training error is non-increasing in d.",s:"Slides 28–29"},
{ch:"5L",t:"For K intervals and degree d, an unconstrained piecewise polynomial has K(d+1) total parameters.",a:true,e:"Each of the K intervals has an independent degree-d polynomial with d+1 coefficients: K × (d+1) parameters in total.",s:"Slide 30"},
{ch:"5L",t:"A regression stump can be viewed as a piecewise constant model (d=0) with K=2 intervals.",a:true,e:"A regression stump splits the domain into two intervals and fits a constant (d=0) in each. This is exactly a piecewise constant model with K=2 pieces.",s:"Slides 30–31, 48–50"},
{ch:"5L",t:"The basis function representation f(x) = Σ_m λ[m] b[m](x) shows that piecewise polynomials belong to the general class of linear basis function models.",a:true,e:"Writing the model as a linear combination of fixed basis functions reveals that piecewise polynomials are linear models in the parameter vector λ, allowing OLS fitting.",s:"Slides 34–35"},
{ch:"5L",t:"The truncated power basis (x−ζ)ᵈ₊ for a spline of degree d automatically ensures continuity of derivatives up to order d−1 at the knot ζ.",a:true,e:"(x−ζ)ᵈ₊ has zero value and zero derivatives of orders 1 through d−1 at x=ζ, so adding this term to a global polynomial preserves all derivatives up to d−1 at the knot.",s:"Slides 37–40"},
{ch:"5L",t:"A natural cubic spline with K knots has K basis functions.",a:true,e:"The natural cubic spline basis has 2 global terms (1, x) plus K−2 constructed basis functions, totalling K parameters.",s:"Slide 44"},
{ch:"5L",t:"Smoothing splines avoid the knot selection problem by using a maximal set of knots (one per data point).",a:true,e:"Instead of choosing knot locations, smoothing splines place a knot at every observed x(i) and use the penalty λ to control how wiggly the resulting function is.",s:"Slides 45–46"},
{ch:"5L",t:"Larger values of λ in smoothing splines result in a wigglier, more complex fitted function.",a:false,e:"Larger λ imposes a heavier curvature penalty, forcing the function toward linearity (smoother). Smaller λ allows more wiggle.",s:"Slides 45–47"},
{ch:"5L",t:"A cubic spline is guaranteed to have a continuous second derivative at every interior knot.",a:true,e:"By construction, a cubic spline satisfies C² continuity at every interior knot: values, first derivatives, and second derivatives all match at knots.",s:"Slide 42"},
{ch:"5L",t:"The risk R(N) of a node under L2 loss, up to a constant, equals the variance of y within that node scaled by node size.",a:true,e:"R(N) = Σ(y−ȳ_N)² = n_N · Var_N(y). The node risk is proportional to the within-node variance.",s:"Slide 52"},
{ch:"5L",t:"The regression stump hypothesis space is H = {f(x) = c₁·1(x≤t) + c₂·1(x>t) | c₁,c₂ ∈ ℝ, t ∈ X}.",a:true,e:"This is exactly the piecewise constant step function with one split point t and two constant predictions.",s:"Slide 49"},
{ch:"5L",t:"Unlike linear regression, regression stumps can capture non-monotone relationships between x and y.",a:true,e:"A stump predicts c₁ for x ≤ t and c₂ for x > t with no restriction on the ordering of c₁ and c₂.",s:"Slides 49–51"},
{ch:"5L",t:"For a binary classification problem (g=2), the Gini impurity simplifies to I(N) = 2π₁(1−π₁) where π₁ is the proportion of class 1.",a:true,e:"With g=2: I = π₁(1−π₁) + π₂(1−π₂) = 2π₁(1−π₁).",s:"Slide 60"},
{ch:"5L",t:"For a binary classification problem (g=2), the entropy impurity simplifies to I(N) = −π₁ log π₁ − (1−π₁) log(1−π₁), the binary entropy.",a:true,e:"With g=2, π₂=1−π₁, so entropy = −π₁ log π₁ − (1−π₁) log(1−π₁).",s:"Slide 60"},
{ch:"5L",t:"The optimal class-probability prediction in a decision stump node under the Bernoulli loss is also the empirical class proportion.",a:true,e:"The Bernoulli (log) loss and Brier score both have the empirical class proportions as their optimal constant predictions within a node.",s:"Slides 58, 65"},
{ch:"5L",t:"Logistic regression with one binary feature x ∈ {0,1} reduces to estimating two independent class proportions.",a:false,e:"Even with a binary feature, logistic regression constrains the log-odds to be linear in x: log(π/(1−π)) = θ₀ + θ₁x. This is not the same as fitting two independent proportions.",s:"Slide 66"},
{ch:"5L",t:"Logistic regression is trained by maximum likelihood estimation, which is equivalent to minimising the Bernoulli loss.",a:true,e:"The MLE objective for the Bernoulli model maximises Σᵢ [y^(i) log π(x^(i)) + (1−y^(i)) log(1−π(x^(i)))], which is exactly the negative of the Bernoulli empirical risk.",s:"Slide 67"},
{ch:"5L",t:"The logistic regression decision boundary f(x)=0 in ℝᵖ is a (p−1)-dimensional hyperplane.",a:true,e:"f(x)=θᵀx+θ₀=0 defines a (p−1)-dimensional affine subspace (hyperplane) in ℝᵖ.",s:"Slides 71–73"},
{ch:"5L",t:"If θ is scaled by 2 in logistic regression, the decision boundary f(x)=0 does not change.",a:true,e:"The boundary f(x)=θᵀx=0 is a scale-invariant condition: (2θ)ᵀx=0 iff θᵀx=0.",s:"Slides 71–72"},
{ch:"5L",t:"Gradient descent is guaranteed to converge for logistic regression on any dataset.",a:false,e:"On linearly separable data the loss has no finite minimum. Gradient descent will not converge but will keep increasing the parameter norm indefinitely.",s:"Slides 75–79"},
{ch:"5L",t:"On linearly separable data, the logistic loss Remp approaches 0 as the parameter norm ||θ||→∞.",a:true,e:"Scaling θ by c>1 increases all margins proportionally. Since the logistic loss L(yf)→0 as yf→∞, the empirical risk approaches 0 as c→∞.",s:"Slides 77–79"},
{ch:"5L",t:"Logistic regression with L2 regularisation λ||θ||² always has a unique finite solution, even on separable data.",a:true,e:"The regularised objective is strictly convex and grows unboundedly as ||θ||→∞, guaranteeing a unique finite global minimum.",s:"Slide 80"},
{ch:"5L",t:"A hyperplane in ℝ² is a line (1-dimensional subspace), and a hyperplane in ℝ³ is a plane (2-dimensional subspace).",a:true,e:"In ℝᵖ a hyperplane is (p−1)-dimensional: ℝ²→line (dim 1), ℝ³→plane (dim 2).",s:"Slide 73"},
{ch:"5L",t:"Two parallel hyperplanes in ℝᵖ can be written as {x: θᵀx+a=0} and {x: θᵀx+b=0} with the same normal vector θ.",a:true,e:"Parallel hyperplanes share the same normal direction θ but have different offsets (a≠b). The distance between them is |a−b|/||θ||.",s:"Slide 73"},
{ch:"5L",t:"In logistic regression, a point x with f(x)=θᵀx=5 is further from the decision boundary than a point with f(x)=2.",a:true,e:"Distance from x to the boundary is |f(x)|/||θ||. For the same θ, |f(x)|=5 > |f(x)|=2, so the first point is further away.",s:"Slide 74"},
{ch:"5L",t:"The R² evaluated on the training set is equivalent to 1 minus the ratio of the fitted linear model's training risk to the constant model's training risk.",a:true,e:"By definition: R² = 1 − Remp(θ)/Remp(c) = 1 − SSE_LM/SSE_const.",s:"Slides 11–13"},
{ch:"5L",t:"A regression stump with L2 loss selects the split that maximises the total within-node variance.",a:false,e:"The stump minimises R(N₁)+R(N₂) = Σ_{N₁}(y−ȳ_{N₁})² + Σ_{N₂}(y−ȳ_{N₂})². This MINIMISES total within-node variance.",s:"Slides 51–52"},
{ch:"5L",t:"Polynomial regression with degree d=n−1 can perfectly interpolate all n training points.",a:true,e:"A polynomial of degree n−1 has n free parameters and can be made to pass through any n points in general position.",s:"Slides 26–29"},
{ch:"5L",t:"The logistic function σ(z) = 1/(1+e^{−z}) satisfies σ(−z) = 1 − σ(z).",a:true,e:"σ(−z) = 1/(1+e^z) = 1 − 1/(1+e^{−z}) = 1−σ(z). This symmetry means the probability of class 0 at score −z equals the probability of class 1 at score z.",s:"Slide 66"},
{ch:"5L",t:"In the basis function representation of splines, the parameter vector λ is estimated by OLS since the model is linear in λ.",a:true,e:"f(x) = Σ_m λ[m] b[m](x) is a linear combination of known basis functions. This is exactly the multivariate linear regression model with design matrix B.",s:"Slides 34–40"},
{ch:"5L",t:"Logistic regression produces the same decision boundary regardless of whether we use the logistic loss or the Bernoulli loss.",a:true,e:"The two formulations are equivalent (same model, same MLE objective, same parameter estimates). They yield identical decision boundaries θᵀx=0.",s:"Slides 66–67"},
{ch:"5L",t:"Regression trees (deep trees) are built by recursively applying the regression stump splitting criterion.",a:true,e:"At each node a stump split is applied, and then each child can itself be split again. Repeating this recursively produces a full regression tree.",s:"Slide 54"},
{ch:"5L",t:"A natural cubic spline is less prone to extrapolation artifacts than an unrestricted cubic spline because its second derivative is forced to zero at boundary knots.",a:false,e:"The constraint is that the function is LINEAR (not just zero second derivative) beyond the boundary knots, meaning both the second and third derivatives are zero in the boundary regions.",s:"Slide 44"},
{ch:"5L",t:"Smoothing splines, unlike regression splines, do not require the user to choose knot locations.",a:true,e:"Smoothing splines use all data points as knots and only require choosing λ (e.g., via CV). Regression splines require explicit knot placement.",s:"Slides 40, 45–47"},
{ch:"5L",t:"The logistic sigmoid function is monotonically increasing.",a:true,e:"σ'(z) = σ(z)(1−σ(z)) > 0 for all finite z. The sigmoid is strictly increasing everywhere.",s:"Slide 66"},
{ch:"5L",t:"Piecewise linear splines (d=1, with continuity) have one fewer parameter per knot compared to unconstrained piecewise linear models.",a:true,e:"Each continuity constraint at a knot eliminates one free parameter. An unconstrained piecewise linear model with K pieces has 2K parameters; a linear spline with K−1 interior knots has K+1 parameters.",s:"Slides 36–40"},
{ch:"5L",t:"The constant baseline model c(x) = ȳ used in R² is the optimal constant predictor under L2 loss.",a:true,e:"Minimising (1/n)Σ(y(i)−c)² w.r.t. c gives c* = ȳ. So the mean is the best constant prediction under L2 loss.",s:"Slides 11–13"},
{ch:"5L",t:"A spline of degree d=0 with K intervals and continuity constraints is equivalent to a continuous piecewise constant model, which must be a single constant everywhere.",a:true,e:"Continuity forces a degree-0 spline to have equal values at every knot. Since adjacent pieces must agree at their shared knot, the entire function must be a single global constant.",s:"Slides 30–36"},
{ch:"5L",t:"The logistic loss is an upper bound on the 0-1 (misclassification) loss.",a:true,e:"log(1+exp(−yf(x))) ≥ 1_{yf(x)<0} for all y,f(x). Minimising logistic loss also implicitly minimises an upper bound on misclassification error.",s:"Slide 66"},
{ch:"5L",t:"The smoothing spline penalised objective has two terms: empirical risk and a roughness penalty, trading off fit and smoothness via λ.",a:true,e:"Rreg = Σ(y(i)−f(x(i)))² + λ∫(f''(t))²dt. The first term measures fit; the second penalises curvature.",s:"Slide 45"},
{ch:"5L",t:"Gini impurity is maximised when all classes are equally represented in a node.",a:true,e:"Equal proportions π_k=1/g maximise I(N)=Σ_k π_k(1−π_k) = (g−1)/g.",s:"Slide 60"},
{ch:"5L",t:"Increasing the number of knots K in piecewise polynomial models always improves generalisation.",a:false,e:"More knots = higher capacity = overfitting risk. Optimal K must be chosen via model selection.",s:"Slides 30–33"},
{ch:"5L",t:"The intercept θ₀ can be encoded as the coefficient of a constant-1 feature, yielding f(x)=θᵀx.",a:true,e:"Standard augmentation trick: x←[1,x₁,…,xₚ]ᵀ and θ←[θ₀,θ₁,…,θₚ]ᵀ so f=θᵀx.",s:"Slide 21"},

/* ──────────────────────── CHAPTER 5 — B-SPLINES (80 questions) ──────────────────────── */
{ch:"5B",t:"In basic linear regression, the model is expressed as µᵢ = α₀ + α₁·xᵢ, representing a straight-line relationship between x and the expected response.",a:true,e:"The basic linear regression model assumes a linear relationship captured by an intercept α₀ and slope α₁.",s:"Slide 4"},
{ch:"5B",t:"In the matrix formulation of linear regression, minimizing ‖y − Xα‖² leads to the normal equations XᵀXα̂ = Xᵀy.",a:true,e:"Setting the derivative of the sum of squared residuals with respect to α to zero yields the normal equations XᵀXα̂ = Xᵀy.",s:"Slide 5"},
{ch:"5B",t:"The least-squares solution α̂ = (XᵀX)⁻¹Xᵀy is obtained by maximizing the residual sum of squares.",a:false,e:"We MINIMIZE the residual sum of squares ‖y − Xα‖². Maximizing it would push the fitted values as far as possible from the data.",s:"Slide 5"},
{ch:"5B",t:"Adding higher powers of x to the design matrix X allows the regression model to capture curved relationships while keeping the same normal-equation structure.",a:true,e:"Polynomial regression adds columns x², x³,... to X. The model is still linear in the parameters α, so the same least-squares normal equations apply.",s:"Slide 7"},
{ch:"5B",t:"Higher-degree polynomial basis functions (powers of x) are numerically stable and well-suited for fitting complex curves.",a:false,e:"The slide explicitly warns: 'Higher degree polynomials are numerically unstable!' Powers of x grow very differently in magnitude, leading to ill-conditioned design matrices.",s:"Slide 8"},
{ch:"5B",t:"A polynomial basis with many terms is a global basis: modifying the fit in one region of x necessarily influences the fit everywhere else.",a:true,e:"Polynomial basis functions (1, x, x², ...) are defined over the entire domain. Adjusting coefficients to fit data better at one end changes the fitted curve globally.",s:"Slide 12"},
{ch:"5B",t:"One advantage of polynomial regression over B-splines is that high-degree polynomials produce stable, well-conditioned fits without unexpected oscillations.",a:false,e:"High-degree polynomials suffer from numerical instability and produce unexpected wiggles (Runge's phenomenon). This is precisely WHY B-splines were introduced as a superior local alternative.",s:"Slide 12"},
{ch:"5B",t:"A key insight from the motorcycle data example is that a polynomial of degree as low as 2 is sufficient to capture the complex crash dynamics.",a:false,e:"The slides show that a polynomial of degree 9 was needed for a decent fit to the motorcycle data.",s:"Slide 10"},
{ch:"5B",t:"High-degree polynomials are sensitive to small data changes: a slight modification in the data can drastically alter the fitted polynomial curve.",a:true,e:"Because polynomial basis functions are global, fitting is highly sensitive. The higher the degree, the more sensitive.",s:"Slide 11"},
{ch:"5B",t:"The main conclusion from studying polynomial regression on the motorcycle data is: use local instead of global basis functions.",a:true,e:"The slide explicitly states: 'Global polynomials are a dead end ⟹ Use local instead of global functions!'",s:"Slide 12"},
{ch:"5B",t:"A B-spline basis function of degree d is non-zero only over the interval spanned by d+2 adjacent knots.",a:true,e:"By definition, the j-th B-spline of degree d has local support: it is non-zero only over the interval between d+2 consecutive knots.",s:"Slide 14"},
{ch:"5B",t:"To define an M-parameter B-spline basis of degree d, exactly M knots are needed.",a:false,e:"You need M + d + 1 knots in total. For example, a cubic (d=3) basis with M=10 requires 10+3+1=14 knots.",s:"Slide 14"},
{ch:"5B",t:"A d-th degree B-spline can be represented as f(x) = Σⱼ αⱼBⱼ(x; d), where αⱼ are spline coefficients.",a:true,e:"This is the fundamental representation: the fitted curve is a linear combination of B-spline basis functions.",s:"Slide 14"},
{ch:"5B",t:"The B-spline basis functions are defined recursively, starting from degree-0 indicator functions that are 1 on [tⱼ, tⱼ₊₁) and 0 elsewhere.",a:true,e:"The de Boor recursion builds higher-degree B-splines from degree-0 box functions: B_j(x;0) = 1 if x ∈ [tⱼ, tⱼ₊₁), 0 otherwise.",s:"Slide 15"},
{ch:"5B",t:"A degree-0 B-spline basis function is a constant (box/indicator) function equal to 1 on one knot interval and 0 everywhere else.",a:true,e:"Bⱼ(x;0) = 1 if x ∈ [tⱼ, tⱼ₊₁), and 0 otherwise. These are the atomic building blocks from which all higher-degree B-splines are recursively constructed.",s:"Slide 15"},
{ch:"5B",t:"A linear B-spline (degree 1) consists of two piecewise straight-line segments joined at knots with matching function values but potentially different slopes.",a:true,e:"A linear B-spline has two linear pieces joined at the interior knot. The function value is continuous, but the slope has a jump at the knot.",s:"Slide 16"},
{ch:"5B",t:"A linear B-spline is continuously differentiable (C¹) at its interior knots.",a:false,e:"A linear (degree-1) B-spline only guarantees C⁰ continuity at knots. C¹ continuity requires at least a quadratic (degree-2) spline.",s:"Slide 16"},
{ch:"5B",t:"A quadratic B-spline (degree 2) consists of three piecewise quadratic segments and is C¹ (matching first derivatives) at its knots.",a:true,e:"A quadratic B-spline has d+1=3 polynomial pieces. At the interior knots it guarantees continuity of both the function value and the first derivative (C¹).",s:"Slide 17"},
{ch:"5B",t:"A cubic B-spline (degree 3) consists of four polynomial pieces and guarantees C² continuity (matching function value, first and second derivatives) at its knots.",a:true,e:"A cubic B-spline has d+1=4 cubic segments and is C² (twice continuously differentiable) at knots.",s:"Slide 18"},
{ch:"5B",t:"Cubic B-splines are preferred in practice because they achieve smoothness up to the second derivative at knots, while higher-degree splines offer little additional visual improvement.",a:true,e:"Cubic splines give C² joins — the human eye can detect discontinuities up to the second derivative. Going to degree 4 or higher rarely improves visual smoothness.",s:"Slide 18"},
{ch:"5B",t:"A quadratic B-spline and a cubic B-spline both have the same number of polynomial pieces (two).",a:false,e:"A degree-d B-spline has d+1 polynomial pieces. A quadratic (d=2) has 3 pieces; a cubic (d=3) has 4 pieces.",s:"Slide 17"},
{ch:"5B",t:"As the degree of a B-spline increases, its shape becomes more similar to a Gaussian bell curve.",a:true,e:"This is explicitly stated in the slides. Going from linear (tent shape) to quadratic to cubic, the B-spline profile approaches a smooth bell curve.",s:"Slide 18"},
{ch:"5B",t:"In the B-spline design matrix B, each row contains the evaluations of all M basis functions at one data point xᵢ, and most entries in each row are zero.",a:true,e:"The matrix B has entry Bⱼ(xᵢ) in row i, column j. Because each B-spline is local (non-zero over only d+1 intervals), each row has at most d+1 non-zero entries.",s:"Slide 21"},
{ch:"5B",t:"In the B-spline design matrix B, every row has exactly M non-zero entries, where M is the number of basis functions.",a:false,e:"Only d+1 basis functions overlap at any given x. So each row has at most d+1 non-zero entries, making the matrix very sparse.",s:"Slide 21"},
{ch:"5B",t:"The fitted value µᵢ for observation xᵢ is computed as a weighted sum of all M B-splines evaluated at xᵢ, but in practice only d+1 of them contribute non-zero values.",a:true,e:"Since each B-spline is non-zero on only d+2 adjacent knot intervals, for any given xᵢ at most d+1 basis functions are active.",s:"Slide 21"},
{ch:"5B",t:"The B-spline coefficients αⱼ can be interpreted as the heights (scaling factors) of the corresponding basis functions.",a:true,e:"As noted in the lecture (handwritten annotation), αⱼ = height of the basis functions. A larger αⱼ pulls the fitted curve up in that local region.",s:"Slide 25"},
{ch:"5B",t:"B-splines are global basis functions: modifying one coefficient αⱼ changes the fitted curve everywhere on the domain.",a:false,e:"B-splines are LOCAL functions. Changing αⱼ only affects the fitted curve in the neighbourhood of the j-th B-spline's support.",s:"Slide 24"},
{ch:"5B",t:"For equal-spacing, the number of knots determines both the width and the number of B-splines in the basis.",a:true,e:"With equal-spaced knots, more knots mean narrower, more numerous B-splines. The knot spacing directly controls the resolution and count of the basis.",s:"Slide 24"},
{ch:"5B",t:"Using more B-splines in the basis always guarantees a smoother fitted curve.",a:false,e:"More B-splines allow MORE detail (higher flexibility), but whether the resulting curve is smooth depends on the coefficients α. With no penalty, you get overfitting and wiggly curves.",s:"Slide 23"},
{ch:"5B",t:"The P-spline approach penalizes the roughness of the spline coefficients α rather than directly penalizing the roughness of the fitted curve.",a:true,e:"The P-spline idea is to control smoothness INDIRECTLY via a penalty on the differences between adjacent coefficients α.",s:"Slide 27"},
{ch:"5B",t:"With a rich B-spline basis (many basis functions), the fitted curve must always be wiggly.",a:false,e:"Even with many basis functions, a perfectly smooth (e.g. constant or linear) fit is achievable — it depends entirely on the coefficient vector α.",s:"Slide 27"},
{ch:"5B",t:"The roughness measure R = Σⱼ(αⱼ − αⱼ₋₁)² quantifies how erratically the spline coefficients change from one basis function to the next.",a:true,e:"R is the sum of squared first differences of adjacent coefficients. Large R means big jumps between αⱼ values → wiggly fit.",s:"Slide 29"},
{ch:"5B",t:"If R = 0 (roughness measure equals zero with a first-order penalty), the fitted curve must be a constant horizontal line.",a:false,e:"R = 0 (first-order penalty) means all differences αⱼ − αⱼ₋₁ = 0, so all coefficients are equal: a constant curve. But with a second-order penalty, R=0 implies a straight line.",s:"Slide 29"},
{ch:"5B",t:"The difference matrix D of size (M−1)×M encodes first-order differences and satisfies Δα = Dα.",a:true,e:"D is the (M−1)×M matrix with −1 on the main diagonal and +1 on the superdiagonal. It maps the coefficient vector α to the vector of first differences.",s:"Slide 31"},
{ch:"5B",t:"The roughness R can be written in matrix form as R = ‖Dα‖² = αᵀDᵀDα.",a:true,e:"Since Δα = Dα, we have R = ‖Δα‖² = ‖Dα‖² = αᵀDᵀDα. This quadratic form makes it easy to incorporate into the penalized least-squares objective.",s:"Slide 32"},
{ch:"5B",t:"In P-spline penalized least squares, the objective function Q = S + λR balances a goodness-of-fit term S against a roughness penalty term R.",a:true,e:"Q = ‖y − Bα‖² + λ‖Dα‖² — the first term S penalizes large residuals (fit), and the second term λR penalizes rough coefficients (smoothness).",s:"Slide 33"},
{ch:"5B",t:"The smoothing parameter λ must be negative for the penalty to enforce smoothness.",a:false,e:"λ must be strictly positive (λ > 0). A negative λ would REWARD roughness instead of penalizing it.",s:"Slide 33"},
{ch:"5B",t:"When λ = 0, the penalized least-squares estimator reduces to the ordinary (unpenalized) B-spline least-squares estimator.",a:true,e:"With λ=0, the penalty term disappears and Q = S = ‖y − Bα‖². The solution is the standard B-spline regression.",s:"Slide 33"},
{ch:"5B",t:"As λ → ∞ with a first-order (d=1) difference penalty, the fitted P-spline curve converges to a horizontal line.",a:true,e:"An infinitely large first-order penalty forces all Δαⱼ ≈ 0, meaning all coefficients are equal. With a constant α vector, Bα becomes a horizontal line.",s:"Slide 35"},
{ch:"5B",t:"As λ → ∞ with a second-order (d=2) difference penalty, the fitted curve converges to a straight line.",a:true,e:"A second-order penalty forces Δ²αⱼ ≈ 0, meaning coefficients form an arithmetic sequence. The B-spline combination of a linearly-varying α reproduces a straight line.",s:"Slide 43"},
{ch:"5B",t:"The penalized least-squares solution is α̂ = (BᵀB + λDᵀD)⁻¹Bᵀy, a small modification of the ordinary least-squares formula.",a:true,e:"Compared to the ordinary solution (BᵀB)⁻¹Bᵀy, the penalized version adds λDᵀD to BᵀB — similar in spirit to ridge regression.",s:"Slide 34"},
{ch:"5B",t:"Increasing λ always decreases the training residuals (improves fit to the data).",a:false,e:"Increasing λ forces smoother α, which reduces roughness R but increases the residual sum S — the fit to the training data gets WORSE.",s:"Slide 35"},
{ch:"5B",t:"A large λ leads to underfitting, while a small λ leads to overfitting in the P-spline framework.",a:true,e:"Small λ ≈ unpenalized regression → overfitting (too wiggly). Large λ → oversmoothing/underfitting.",s:"Slide 35"},
{ch:"5B",t:"The penalized least-squares estimator for P-splines is computationally similar to ridge regression.",a:true,e:"Ridge regression adds λI to XᵀX; P-splines add λDᵀD to BᵀB. Both regularize by modifying the Gram matrix.",s:"Slide 34"},
{ch:"5B",t:"The first-order difference penalty λ‖Dα‖² penalizes large changes between adjacent coefficients, encouraging a constant fit when λ is large.",a:true,e:"First-order differences Δαⱼ = αⱼ − αⱼ₋₁. Penalizing these to zero forces all αⱼ to be equal → constant fit.",s:"Slide 35"},
{ch:"5B",t:"The second-order difference penalty uses Δ²αⱼ = αⱼ − 2αⱼ₋₁ + αⱼ₋₂, a discrete approximation to the second derivative of α.",a:true,e:"Δ²αⱼ = (αⱼ − αⱼ₋₁) − (αⱼ₋₁ − αⱼ₋₂) = αⱼ − 2αⱼ₋₁ + αⱼ₋₂. This is analogous to the second derivative in continuous calculus.",s:"Slide 36"},
{ch:"5B",t:"The second-order difference matrix D₂ has M−2 rows and M columns.",a:true,e:"Each row of D₂ involves three consecutive coefficients. Starting from j=3 to j=M gives M−2 rows.",s:"Slide 36"},
{ch:"5B",t:"The third-order difference Δ³αⱼ = αⱼ − 3αⱼ₋₁ + 3αⱼ₋₂ − αⱼ₋₃ follows binomial coefficients with alternating signs.",a:true,e:"The third-order difference is (1, −3, 3, −1), which are the binomial coefficients from row 3 of Pascal's triangle with alternating signs.",s:"Slide 38"},
{ch:"5B",t:"Higher-order difference penalties (e.g. d=2, d=3) are commonly preferred over first-order in most practical applications.",a:false,e:"The lecture annotation explicitly states that third-order differences are 'in my experience very rarely used.' First and second-order differences cover most practical cases.",s:"Slide 38"},
{ch:"5B",t:"With a d-th order difference penalty and λ → ∞, the fitted curve converges to a polynomial of degree d−1.",a:true,e:"Forcing d-th order differences to zero means the coefficient sequence is a polynomial of degree d−1. The B-spline combination then reproduces a polynomial of degree d−1.",s:"Slide 45"},
{ch:"5B",t:"When data has large gaps in x, unpenalized B-spline regression can fail because some basis functions have no observations in their support, leading to a singular system.",a:true,e:"If no data falls in the support of a basis function, its column in B is all zeros, making BᵀB rank-deficient (singular).",s:"Slide 39"},
{ch:"5B",t:"Adding a penalty term λ‖Dα‖² resolves the singularity problem caused by gaps in x, because the penalty links adjacent coefficients and propagates information across the gap.",a:true,e:"The penalty forces neighbouring αⱼ to be similar ('hold hands'), so even coefficients in gap regions are constrained by their non-gap neighbours.",s:"Slide 40"},
{ch:"5B",t:"For extrapolation, B-splines with a difference penalty automatically produce a polynomial of degree matching the order of the penalty outside the data range.",a:true,e:"Beyond the data range, the penalty dominates. For a d-th order penalty, the extrapolated curve behaves as a polynomial of degree d−1.",s:"Slide 42"},
{ch:"5B",t:"For extrapolation using P-splines, one should keep the domain of x narrow to avoid using basis functions with no data support.",a:false,e:"The correct strategy is the OPPOSITE: 'Just choose the domain of x wide enough' and 'Take a generous number of (cubic) B-splines'. The penalty bridges the gap automatically.",s:"Slide 41"},
{ch:"5B",t:"With a first-order difference penalty (d=1) and strong smoothing, P-spline extrapolation produces a flat (constant) extension beyond the data range.",a:true,e:"d=1 penalty: large λ forces all coefficient differences ≈ 0 → all αⱼ equal in the extrapolation region → flat (constant) curve.",s:"Slide 42"},
{ch:"5B",t:"With a second-order difference penalty (d=2) and strong smoothing, P-spline extrapolation extends the curve as a straight line beyond the data.",a:true,e:"d=2 penalty: second differences forced to zero → αⱼ sequence is linear → B-spline combination extrapolates linearly.",s:"Slide 43"},
{ch:"5B",t:"With a third-order difference penalty (d=3) and strong smoothing, P-spline extrapolation produces a quadratic extension beyond the data.",a:true,e:"d=3: third differences = 0 → α is a quadratic polynomial in j → extrapolation is a quadratic curve.",s:"Slide 44"},
{ch:"5B",t:"The smoothing parameter λ is typically set automatically by the analyst without any need for data-driven selection.",a:false,e:"The wrap-up slide states 'λ has to be tuned to find the optimal amount of penalization, e.g. via K-fold CV'.",s:"Slide 46"},
{ch:"5B",t:"K-fold cross-validation is a valid data-driven method for selecting the optimal λ in P-spline regression.",a:true,e:"The lecture's wrap-up slide annotations read: 'λ has to be tuned to find the optimal amount of penalization ⟹ e.g. via K-fold CV.'",s:"Slide 46"},
{ch:"5B",t:"For very large λ (e.g. λ = 10⁶), the P-spline fit with a d=3 penalty approximates a cubic polynomial trend.",a:false,e:"λ → ∞ with d=3 forces Δ³α ≈ 0, making α quadratic in j, so the fit approaches a QUADRATIC (degree d−1 = 2) polynomial, not cubic.",s:"Slide 45"},
{ch:"5B",t:"The roughness measure r being small always means the fit to the data (residuals) is also small.",a:false,e:"r (roughness) and s (root mean squared residual) are in tension. Large λ gives small r (smooth α) but large s (poor fit).",s:"Slide 35"},
{ch:"5B",t:"In a B-spline basis with equal spacing, using 25 B-splines instead of 10 results in narrower individual basis functions.",a:true,e:"More B-splines on the same domain means knots are closer together, so each B-spline spans fewer intervals → narrower support.",s:"Slide 20"},
{ch:"5B",t:"The sum of all B-spline basis functions at any point x in the interior of the domain equals 1 (partition of unity).",a:true,e:"B-splines form a partition of unity: at any x, the active B-splines sum to 1.",s:"Slide 19"},
{ch:"5B",t:"B-spline basis functions are always non-negative: Bⱼ(x; d) ≥ 0 for all x.",a:true,e:"By the recursive construction, B-splines are always non-negative.",s:"Slide 15"},
{ch:"5B",t:"The locality of B-splines means that fitting or prediction at one region of x is independent of observations in distant regions (without a penalty).",a:true,e:"Without a penalty, each αⱼ is influenced only by data points xᵢ that fall in the support of Bⱼ. This is the key locality property.",s:"Slide 24"},
{ch:"5B",t:"In P-spline regression, using a larger number of B-splines always leads to better predictive performance.",a:false,e:"Without regularization, more B-splines → more flexibility → overfitting. The P-spline idea is to use a rich basis AND a penalty together.",s:"Slide 27"},
{ch:"5B",t:"A P-spline with 25 cubic B-splines and an appropriate λ can produce a smooth fit, while the same basis with λ=0 would likely overfit.",a:true,e:"This is the central P-spline insight. A large basis with no penalty overfits. Adding a penalty controls roughness and produces smooth, well-fitting curves.",s:"Slide 27"},
{ch:"5B",t:"The B-spline design matrix B has n rows (observations) and M columns (basis functions).",a:true,e:"Each of the n rows corresponds to one observation xᵢ, and each of the M columns contains one basis function evaluated at all xᵢ.",s:"Slide 21"},
{ch:"5B",t:"When λ → ∞ with a second-order penalty, all spline coefficients become equal to each other.",a:false,e:"With a FIRST-order penalty, all αⱼ equal each other when λ → ∞. With a SECOND-order penalty, α forms an arithmetic sequence (linear in j) — adjacent αs are equally spaced, not equal.",s:"Slide 36"},
{ch:"5B",t:"The 'strong smoothing' limiting behaviour of P-splines with order-d penalty produces exactly a polynomial of degree d−1 as λ → ∞.",a:true,e:"Forcing d-th order differences to zero constrains α to be a polynomial of degree d−1 in j. The B-spline basis then reproduces this exact polynomial.",s:"Slide 45"},
{ch:"5B",t:"P-splines are defined as B-spline regression with a difference penalty on the coefficients, combining a rich local basis with smoothness regularization.",a:true,e:"This is the complete definition of P-splines (Eilers & Marx, 1996): use a generous B-spline basis matrix B and minimise Q = ‖y − Bα‖² + λ‖Dα‖².",s:"Slide 46"},
{ch:"5B",t:"B-splines fix the problem of polynomial regression by replacing global basis functions with local ones that are non-zero only in a limited region of x.",a:true,e:"This is the core motivation. Global polynomials are problematic because any change in one region affects all others. B-splines have compact support.",s:"Slide 13"},
{ch:"5B",t:"The regression model µ = Bα for B-splines is estimated using the same normal-equation machinery as ordinary linear regression, just with a different design matrix.",a:true,e:"The model is linear in α: µ = Bα. The B-spline basis matrix B plays exactly the role of the design matrix X in ordinary regression.",s:"Slide 21"},
{ch:"5B",t:"Orthogonal polynomials can partially address the numerical instability of high-degree polynomial regression.",a:true,e:"The slides note 'use orthogonal polynomials' as a remedy for the bad numerical condition of high-degree polynomial basis.",s:"Slide 10"},
{ch:"5B",t:"P-splines can handle both interpolation (filling gaps within the data range) and extrapolation (predicting beyond the data range) using the same penalty framework.",a:true,e:"The penalty links adjacent α values, bridging gaps within the data range and extending the trend beyond it.",s:"Slide 41"},
{ch:"5B",t:"The motorcycle helmet impact data is an example where simple linear regression provides a sufficient fit.",a:false,e:"The motorcycle data shows a highly non-linear pattern. A straight line gives a completely flat fit, missing the entire crash dynamics.",s:"Slide 9"},
{ch:"5B",t:"In the P-spline framework, the matrix DᵀD acts as a penalty matrix that shrinks differences between adjacent coefficients.",a:true,e:"DᵀD is the positive semi-definite penalty matrix. Adding λDᵀD to BᵀB in the normal equations penalises roughness in α.",s:"Slide 32"},
{ch:"5B",t:"The P-spline objective Q = ‖y − Bα‖² + λ‖Dα‖² is minimised by setting its gradient w.r.t. α to zero, yielding (BᵀB + λDᵀD)α̂ = Bᵀy.",a:true,e:"Differentiating Q: ∂Q/∂α = −2Bᵀy + 2(BᵀB + λDᵀD)α = 0 ⟹ (BᵀB + λDᵀD)α̂ = Bᵀy.",s:"Slide 34"},
{ch:"5B",t:"The difference matrix D in P-splines has M rows and M−1 columns (for first-order differences).",a:false,e:"It's the other way around: D has M−1 ROWS and M COLUMNS. Each row computes one first difference αⱼ − αⱼ₋₁.",s:"Slide 31"},
{ch:"5B",t:"The P-spline penalty on second-order differences is equivalent to approximating a penalty on the squared second derivative of the fitted curve, connecting it to natural cubic spline smoothing.",a:true,e:"Penalising ‖D₂α‖² approximates ∫(f''(x))² dx — the classic smoothing spline criterion.",s:"Slide 36"},
{ch:"5B",t:"In the B-spline framework, scalar coefficients αⱼ associated with basis functions that lie in a gap region of x (no data) are unidentifiable without a penalty.",a:true,e:"With no data in the support of Bⱼ, the corresponding column of B is zero. BᵀB is rank-deficient, so αⱼ cannot be estimated.",s:"Slide 39"}
];

/* ═══════════════════════════════════════════════════════
   STATE
   ═══════════════════════════════════════════════════════ */
let activeFilter = "all";
let displayedQ = [];
let answered = {};    // idx → bool (user answer)
let scoreMap = {};    // idx → +1 or -1
let totalScore = 0;
let totalCorrect = 0;
let totalWrong = 0;

function getFiltered() {
  return activeFilter === "all"
    ? ALL_Q
    : ALL_Q.filter(q => q.ch === activeFilter);
}

function setFilter(ch) {
  activeFilter = ch;
  document.querySelectorAll('.pill').forEach(p => {
    p.classList.toggle('active', p.dataset.ch === ch);
  });
  rebuildDisplay();
}

function rebuildDisplay() {
  // recompute displayedQ order (keep shuffle state if shuffled)
  const base = getFiltered();
  displayedQ = base.map(q => ALL_Q.indexOf(q));
  render();
}

function doShuffle() {
  const base = getFiltered();
  const idxs = base.map(q => ALL_Q.indexOf(q));
  for (let i = idxs.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [idxs[i], idxs[j]] = [idxs[j], idxs[i]];
  }
  displayedQ = idxs;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function doReset() {
  answered = {};
  scoreMap = {};
  totalScore = 0;
  totalCorrect = 0;
  totalWrong = 0;
  activeFilter = "all";
  document.querySelectorAll('.pill').forEach(p => {
    p.classList.toggle('active', p.dataset.ch === 'all');
  });
  displayedQ = ALL_Q.map((_, i) => i);
  render();
  updateStats();
  document.getElementById('result-panel').classList.remove('vis');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function render() {
  const container = document.getElementById('qContainer');
  container.innerHTML = '';

  if (displayedQ.length === 0) {
    container.innerHTML = '<div class="empty">No questions for this filter.</div>';
    updateStats();
    updateProgress();
    return;
  }

  displayedQ.forEach((globalIdx, displayPos) => {
    const q = ALL_Q[globalIdx];
    const ua = answered[globalIdx];
    const revealed = ua !== undefined;

    const card = document.createElement('div');
    card.className = 'q-card';
    card.id = 'card-' + globalIdx;

    card.innerHTML = `
      <div class="q-head">
        <span class="q-num">Q${displayPos + 1}</span>
        <span class="q-text">${q.t}</span>
      </div>
      <div class="q-btns">
        <button class="opt t" id="yes-${globalIdx}" onclick="answer(${globalIdx},true)">✓ True</button>
        <button class="opt f" id="no-${globalIdx}" onclick="answer(${globalIdx},false)">✗ False</button>
      </div>
      <div class="exp" id="exp-${globalIdx}">
        <div class="exp-inner" id="exp-inner-${globalIdx}">
          <div class="verdict" id="verdict-${globalIdx}"></div>
          <div id="exp-text-${globalIdx}"></div>
          <span class="slide-tag" id="slide-tag-${globalIdx}"></span>
        </div>
      </div>
    `;
    container.appendChild(card);

    if (revealed) {
      applyAnswerStyles(globalIdx, ua);
    }
  });

  updateProgress();
  updateStats();
}

function answer(idx, userAns) {
  if (answered[idx] !== undefined) return;
  answered[idx] = userAns;
  const q = ALL_Q[idx];
  const correct = userAns === q.a;

  if (correct) {
    totalScore++;
    totalCorrect++;
    scoreMap[idx] = 1;
  } else {
    totalScore--;
    totalWrong++;
    scoreMap[idx] = -1;
  }

  applyAnswerStyles(idx, userAns);
  updateStats();
  updateProgress();
}

function applyAnswerStyles(idx, userAns) {
  const q = ALL_Q[idx];
  const correct = userAns === q.a;
  const yesBtn = document.getElementById('yes-' + idx);
  const noBtn  = document.getElementById('no-' + idx);
  if (!yesBtn) return;

  yesBtn.disabled = true;
  noBtn.disabled  = true;

  if (correct) {
    if (userAns) yesBtn.className = 'opt t ok';
    else         noBtn.className  = 'opt f ok';
  } else {
    if (userAns) {
      yesBtn.className = 'opt t bad';
      noBtn.className  = 'opt f show-ok';
    } else {
      noBtn.className  = 'opt f bad';
      yesBtn.className = 'opt t show-ok';
    }
  }

  const expDiv  = document.getElementById('exp-' + idx);
  const inner   = document.getElementById('exp-inner-' + idx);
  const verdict = document.getElementById('verdict-' + idx);
  const expText = document.getElementById('exp-text-' + idx);
  const slideTag= document.getElementById('slide-tag-' + idx);

  inner.className   = 'exp-inner ' + (correct ? 'ok' : 'bad');
  verdict.textContent = correct ? '✓ Correct' : '✗ Incorrect';
  expText.textContent = q.e;
  slideTag.textContent = '📄 ' + q.s;
  expDiv.classList.add('vis');
}

function updateStats() {
  const answeredCount = Object.keys(answered).length;
  document.getElementById('sCorr').textContent = totalCorrect;
  document.getElementById('sWrong').textContent = totalWrong;
  document.getElementById('sLeft').textContent  = displayedQ.length - displayedQ.filter(i => answered[i] !== undefined).length;
  const pct = answeredCount > 0 ? Math.round(100 * totalCorrect / answeredCount) : null;
  const pctEl = document.getElementById('sPct');
  pctEl.textContent = pct !== null ? pct + '%' : '—';
  pctEl.style.color = pct === null ? 'var(--muted)' : pct >= 70 ? 'var(--green)' : pct >= 50 ? 'var(--gold)' : 'var(--red)';
  document.getElementById('scoreBadge').textContent = 'Score: ' + totalScore;
}

function updateProgress() {
  const total = displayedQ.length;
  const done  = displayedQ.filter(i => answered[i] !== undefined).length;
  const pct   = total > 0 ? (done / total) * 100 : 0;
  document.getElementById('progFill').style.width = pct + '%';
  document.getElementById('progLabel').textContent = done + ' / ' + total;
}

function showResults() {
  const total = displayedQ.length;
  const done  = displayedQ.filter(i => answered[i] !== undefined).length;
  const skipped = total - done;

  document.getElementById('finalScore').textContent = totalScore;
  document.getElementById('rCorr').textContent = totalCorrect;
  document.getElementById('rWrong').textContent = totalWrong;
  document.getElementById('rSkip').textContent  = skipped;

  const panel = document.getElementById('result-panel');
  panel.classList.add('vis');
  panel.scrollIntoView({ behavior: 'smooth' });
}

/* Init */
displayedQ = ALL_Q.map((_, i) => i);
render();
</script>
