<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GLM Quiz – True/False</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1117;
    --surface: #181c27;
    --card: #1e2333;
    --border: #2a3050;
    --accent: #5b8dee;
    --accent2: #e85d75;
    --true-col: #3dd68c;
    --false-col: #e85d75;
    --text: #dde3f5;
    --muted: #7a87a8;
    --highlight: #2a3a6a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    min-height: 100vh;
    padding: 0 0 60px 0;
  }

  /* ── HEADER ── */
  header {
    background: linear-gradient(135deg, #131828 0%, #1a2240 100%);
    border-bottom: 1px solid var(--border);
    padding: 8px 10px 6px;
    position: sticky; top: 0; z-index: 100;
    backdrop-filter: blur(10px);
    max-height: 10vh;
    min-height: 0;
    overflow: hidden;
  }
  header h1 {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.85rem;
    letter-spacing: 0.05em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .scorebar {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  }
  .stat {
    display: flex; flex-direction: column; align-items: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px 10px;
    min-width: 50px;
  }
  .stat-val { font-family: 'IBM Plex Mono', monospace; font-size: 1rem; font-weight: 600; }
  .stat-lbl { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-top: 1px; }
  .stat.answered .stat-val { color: var(--accent); }
  .stat.correct .stat-val { color: var(--true-col); }
  .stat.wrong .stat-val { color: var(--false-col); }
  .stat.score-val .stat-val { color: #f0c94a; }

  .header-btns { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; align-items: center; }
  .btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 5px 10px;
    border-radius: 5px;
    border: 1px solid var(--border);
    cursor: pointer;
    background: var(--surface);
    color: var(--text);
    transition: all 0.15s;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { opacity: 0.85; }
  .btn.danger { border-color: var(--false-col); color: var(--false-col); }
  .btn.danger:hover { background: var(--false-col); color: #fff; }

  /* ── FILTER TABS ── */
  .filter-bar {
    padding: 14px 32px;
    display: flex; gap: 8px; flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .filter-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.68rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 5px 13px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
  }
  .filter-btn:hover, .filter-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  /* ── MAIN ── */
  main { max-width: 900px; margin: 0 auto; padding: 28px 24px; }

  /* ── SECTION HEADING ── */
  .section-heading {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    border-left: 3px solid var(--accent);
    padding-left: 10px;
    margin: 36px 0 16px;
  }
  .section-heading:first-child { margin-top: 0; }

  /* ── QUESTION CARD ── */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 14px;
    overflow: hidden;
    transition: border-color 0.2s;
  }
  .card.correct-answer { border-color: var(--true-col); border-width: 2px; }
  .card.wrong-answer   { border-color: var(--false-col); border-width: 2px; }

  .card-top {
    display: flex; align-items: flex-start; gap: 14px;
    padding: 16px 18px 14px;
  }
  .q-num {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    font-weight: 600;
    color: var(--muted);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 3px 8px;
    white-space: nowrap;
    margin-top: 2px;
    flex-shrink: 0;
  }
  .statement {
    font-size: 0.93rem;
    line-height: 1.6;
    color: var(--text);
    flex: 1;
  }

  /* ── ANSWER BUTTONS ── */
  .answer-row {
    display: flex; gap: 6px;
    padding: 0 14px 12px;
    flex-wrap: nowrap;
  }
  .ans-btn {
    flex: 1;
    min-width: 0;
    padding: 7px 0;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: all 0.15s;
  }
  .ans-btn:hover { border-color: var(--text); color: var(--text); }
  .ans-btn.selected-true  { background: rgba(61,214,140,0.12); border-color: var(--true-col); color: var(--true-col); }
  .ans-btn.selected-false { background: rgba(232,93,117,0.12); border-color: var(--false-col); color: var(--false-col); }

  /* ── REVEAL PANEL ── */
  .reveal-btn {
    display: block;
    width: calc(100% - 36px);
    margin: 0 18px 14px;
    padding: 8px;
    background: transparent;
    border: 1px dashed var(--border);
    border-radius: 8px;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.15s;
  }
  .reveal-btn:hover { border-color: var(--accent); color: var(--accent); }

  .answer-panel {
    display: none;
    border-top: 1px solid var(--border);
    padding: 14px 18px;
    background: rgba(255,255,255,0.02);
  }
  .answer-panel.visible { display: block; }

  .answer-badge {
    display: inline-block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    padding: 3px 12px;
    border-radius: 20px;
    margin-bottom: 10px;
  }
  .answer-badge.true  { background: rgba(61,214,140,0.15); color: var(--true-col); border: 1px solid var(--true-col); }
  .answer-badge.false { background: rgba(232,93,117,0.15); color: var(--false-col); border: 1px solid var(--false-col); }

  .result-indicator {
    display: inline-block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.75rem;
    margin-left: 10px;
    padding: 3px 10px;
    border-radius: 20px;
  }
  .result-indicator.correct { background: rgba(61,214,140,0.1); color: var(--true-col); }
  .result-indicator.wrong   { background: rgba(232,93,117,0.1); color: var(--false-col); }

  .slide-ref {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    color: var(--accent);
    margin-bottom: 8px;
    display: flex; align-items: center; gap: 6px;
  }
  .slide-ref::before { content: "📍"; }

  .explanation {
    font-size: 0.85rem;
    line-height: 1.65;
    color: #a8b4d0;
  }

  /* ── PROGRESS BAR ── */
  .progress-wrap {
    height: 3px;
    background: var(--border);
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--true-col));
    transition: width 0.3s;
  }

  /* ── RESULT MODAL ── */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 300;
    align-items: center; justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 36px 40px;
    max-width: 440px;
    width: 90%;
    text-align: center;
  }
  .modal h2 {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 1.1rem;
    letter-spacing: 0.08em;
    margin-bottom: 20px;
    color: var(--accent);
  }
  .big-score {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 3.5rem;
    font-weight: 700;
    color: #f0c94a;
    line-height: 1;
    margin-bottom: 6px;
  }
  .modal p { color: var(--muted); font-size: 0.9rem; margin-bottom: 22px; }
  .pass-badge {
    display: inline-block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.85rem;
    font-weight: 700;
    padding: 6px 20px;
    border-radius: 30px;
    margin-bottom: 24px;
  }
  .pass-badge.pass { background: rgba(61,214,140,0.15); color: var(--true-col); border: 1px solid var(--true-col); }
  .pass-badge.fail { background: rgba(232,93,117,0.15); color: var(--false-col); border: 1px solid var(--false-col); }

  /* unanswered warning */
  .unanswered-note { color: var(--muted); font-size: 0.78rem; margin-top: 8px; }

  @media (max-width: 600px) {
    header { padding: 8px 8px 6px; max-height: 10vh; }
    header h1 { font-size: 0.82rem; margin-bottom: 3px; }
    .scorebar { gap: 6px; }
    .stat { padding: 3px 8px; min-width: 45px; }
    .stat-val { font-size: 0.95rem; }
    .stat-lbl { font-size: 0.55rem; }
    .btn { padding: 4px 8px; font-size: 0.62rem; }
    main { padding: 16px 8px; }
    .filter-bar { padding: 8px 10px; }
    .answer-row { gap: 5px; padding: 0 10px 10px; }
    .ans-btn { font-size: 0.72rem; padding: 6px 0; }
  }
</style>
</head>
<body>

<header>
  <h1>GLM Quiz — True / False Practice</h1>
  <div style="display:flex; align-items:center; flex-wrap:wrap; gap:14px;">
    <div class="scorebar">
      <div class="stat answered"><span class="stat-val" id="s-answered">0</span><span class="stat-lbl">Answered</span></div>
      <div class="stat" style="color:var(--muted)"><span class="stat-val" id="s-total">149</span><span class="stat-lbl">Total</span></div>
      <div class="stat correct"><span class="stat-val" id="s-correct">0</span><span class="stat-lbl">Correct</span></div>
      <div class="stat wrong"><span class="stat-val" id="s-wrong">0</span><span class="stat-lbl">Wrong</span></div>
      <div class="stat score-val"><span class="stat-val" id="s-score">0</span><span class="stat-lbl">Score</span></div>
    </div>
    <div class="header-btns">
      <a href="index.html" style="padding:6px 14px;border-radius:6px;border:1.5px solid var(--accent);color:var(--accent);font-family:'IBM Plex Sans',sans-serif;font-size:.83rem;font-weight:600;text-decoration:none;white-space:nowrap;transition:all .15s" onmouseover="this.style.background='rgba(91,141,238,.15)'" onmouseout="this.style.background='transparent'">← ASL Quiz</a>
      <button class="btn" onclick="revealAll()">Reveal All</button>
      <button class="btn" onclick="showResults()">Results</button>
      <button class="btn danger" onclick="resetAll()">Reset</button>
    </div>
  </div>
</header>

<div class="filter-bar" id="filterBar"></div>

<main id="main"></main>

<div class="progress-wrap"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2>Your Results</h2>
    <div class="big-score" id="modalScore">0</div>
    <p id="modalDetail"></p>
    <div class="pass-badge" id="modalBadge"></div>
    <p class="unanswered-note" id="modalUnanswered"></p>
    <br>
    <button class="btn primary" onclick="document.getElementById('modal').classList.remove('open')">Close</button>
  </div>
</div>

<script>
const questions = [
  { num:1,  task:"Task 1: Basic Concepts of Regression", answer:"TRUE",  slide:"Basic Concepts – Slide 3",        statement:"In regression analysis, the dependent variable y is also referred to as the response variable or outcome.", explanation:"Slide 3 lists the synonyms for y: outcome, target variable, response variable, and dependent variable." },
  { num:2,  answer:"FALSE", slide:"Basic Concepts – Slide 28",       statement:"In the classical linear regression model, the error terms εᵢ are assumed to have a non-zero mean.", explanation:"Slide 28 lists Assumption 1: E(εᵢ) = 0 (zero mean errors)." },
  { num:3,  answer:"TRUE",  slide:"Basic Concepts – Slide 28",       statement:"The classical linear regression model assumes that the error terms εᵢ are uncorrelated with each other.", explanation:"Slide 28 lists Assumption 3: Cov(εᵢ, εⱼ) = 0, meaning errors are uncorrelated." },
  { num:4,  answer:"FALSE", slide:"Basic Concepts – Slide 28",       statement:"In the classical linear regression model, all four assumptions (zero mean, constant variance, zero covariance, normality) are strictly required for parameter estimation via OLS.", explanation:"Slide 28 notes that Assumption 4 (normality) is needed for testing/inference only, not for OLS estimation itself." },
  { num:5,  answer:"TRUE",  slide:"Basic Concepts – Slides 13, 15",  statement:"In the linear model E(y|x) = β₀ + β₁x₁ + … + βₚxₚ, the coefficient β₁ represents the expected change in y when x₁ increases by one unit, holding all other variables fixed.", explanation:"Slide 13 shows β₁ as the per-unit change in y; Slide 15 explicitly states βⱼ is interpretable given other variables are fixed (adjustment)." },
  { num:6,  answer:"FALSE", slide:"Basic Concepts – Slide 15",       statement:"Marginal correlation and conditional correlation between two variables are always equal in a multiple regression setting.", explanation:"Slide 15 explicitly states: 'marginal correlation ≠ conditional correlation.'" },
  { num:7,  answer:"TRUE",  slide:"Basic Concepts – Slide 29",       statement:"In the alternative representation of the classical linear regression model, the random component is yᵢ | xᵢ ~ N(µᵢ, σ²) and the systematic component is µᵢ = xᵢᵀβ.", explanation:"Slide 29 presents the alternative decomposition: random component yᵢ|xᵢ ~ N(µᵢ,σ²) and systematic component µᵢ = xᵢᵀβ." },
  { num:8,  answer:"FALSE", slide:"Basic Concepts – Slide 26",       statement:"The linear predictor η = x⊤β can only include metrical (continuous) covariates.", explanation:"Slide 26 states variables can be metrical, encoded, or both, and may include polynomial terms such as age²." },

  { num:9,  task:"Task 2: Encoding of Covariates", answer:"FALSE", slide:"Basic Concepts – Slide 19", statement:"In dummy (0/1) coding with k categories, all k indicator variables can be included in the model simultaneously without any restriction.", explanation:"Slide 19 identifies this as a problem (perfect multicollinearity). Slide 20 resolves it by setting one reference category to 0." },
  { num:10, answer:"TRUE",  slide:"Basic Concepts – Slide 20",       statement:"In dummy coding, the reference category is the one whose coefficient is set to zero, and all other coefficients represent differences relative to that reference.", explanation:"Slide 20: 'Set category k to 0 → βⱼ₍ₖ₎ = 0 → reference category.' All other coefficients represent deviations from the reference." },
  { num:11, answer:"TRUE",  slide:"Basic Concepts – Slide 23",       statement:"In effect encoding, the constraint applied is that all category-specific coefficients sum to zero (Σᵢ βⱼ₍ᵢ₎ = 0).", explanation:"Slide 23 states the restriction for effect encoding: Σᵢ₌₁ᵏ βⱼ₍ᵢ₎ = 0, making β₀ interpretable as the grand mean." },
  { num:12, answer:"FALSE", slide:"Basic Concepts – Slide 23",       statement:"In effect encoding, the intercept β₀ represents the expected value for the reference category.", explanation:"Slide 23 shows that under effect encoding β₀ is the overall (grand) mean across all categories — not the reference category mean." },
  { num:13, answer:"TRUE",  slide:"Basic Concepts – Slide 16",       statement:"A binary covariate xⱼ ∈ {0,1} can be included directly in the linear model without special encoding.", explanation:"Slide 16 covers binary covariates: xⱼ is already 0/1 and enters directly; β₁ gives the expected difference between the two groups." },

  { num:14, task:"Task 3: Models for Binary Outcome", answer:"FALSE", slide:"Binary Outcome – Slides 3, 4", statement:"Applying a standard linear regression model directly to a binary response y ∈ {0,1} is unproblematic because probabilities are always between 0 and 1.", explanation:"Slide 3 raises the question; Slide 4 lists reasons against: predicted values can fall outside [0,1] and the variance is non-constant (Bernoulli)." },
  { num:15, answer:"TRUE",  slide:"Binary Outcome – Slide 5",        statement:"The binary regression model can be motivated via Bayes' theorem by assuming x | y = i ~ N(µᵢ, Σ).", explanation:"Slide 5 sets up the Bayes motivation with the assumption x|y=i ~ N(µᵢ,Σ), from which the logistic form is derived." },
  { num:16, answer:"TRUE",  slide:"Binary Outcome – Slide 9",        statement:"In the latent variable motivation of binary regression, the unobservable continuous variable ỹ is called a latent variable.", explanation:"Slide 9 introduces the latent variable: 'actually continuous ỹ in the background... Not observable or unknown: latent.'" },
  { num:17, answer:"TRUE",  slide:"Binary Outcome – Slide 12",       statement:"In the latent variable framework, the observed binary outcome is defined as yᵢ = 1 if and only if the latent variable ỹᵢ ≥ ϑ.", explanation:"Slide 12 states exactly: yᵢ = 1 ⟺ ỹᵢ ≥ ϑ." },
  { num:18, answer:"FALSE", slide:"Binary Outcome – Slide 14",       statement:"Choosing F(·) to be the Gaussian (normal) CDF in πᵢ(xᵢ) = F(β₀ + xᵢ⊤β) yields the logit model.", explanation:"Slide 14: F(·) = logistic CDF → logit model; F(·) = Gaussian CDF → probit model (only rarely used)." },
  { num:19, answer:"TRUE",  slide:"Binary Outcome – Slide 14",       statement:"The logistic CDF is the most frequently used choice for F(·) in binary regression models.", explanation:"Slide 14 annotates the logistic choice as 'most frequently used'; probit is 'only rarely used'; Gumbel/Gompertz are 'very rarely used.'" },

  { num:20, task:"Task 4: Logistic Regression", answer:"TRUE", slide:"Logistic Regression – Slide 3", statement:"The three representations of logistic regression — probability form, odds form, and log-odds form — are mathematically equivalent.", explanation:"Slide 3 presents all three as 'Equivalent representations.'" },
  { num:21, answer:"TRUE",  slide:"Logistic Regression – Slide 4",   statement:"The logistic function F(η) = exp(η)/(1+exp(η)) is a valid cumulative distribution function (CDF).", explanation:"Slide 4 states: 'F(η) is a distribution function' and lists the CDF properties." },
  { num:22, answer:"TRUE",  slide:"Logistic Regression – Slide 5",   statement:"The logistic function satisfies the point-symmetry property F(0) = 0.5 and F(η) = 1 − F(−η).", explanation:"Slide 5: 'F(·) is point-symmetric: F(0) = 0.5 and F(η) = 1 − F(−η).'" },
  { num:23, answer:"FALSE", slide:"Logistic Regression – Slide 7",   statement:"In logistic regression, a positive coefficient β₁ > 0 implies that the probability P(y=1|x) decreases as x₁ increases.", explanation:"Slide 7: β₁ > 0 means the probability increases with x₁; only β₁ < 0 implies a decrease." },
  { num:24, answer:"TRUE",  slide:"Logistic Regression – Slide 10",  statement:"When x₁ increases by 1 unit, the odds π(x)/(1−π(x)) are multiplied by a factor of exp(β₁).", explanation:"Slide 10 derives: increasing x₁ by 1 multiplies the odds by exp(β₁) — the odds ratio interpretation." },
  { num:25, answer:"TRUE",  slide:"Logistic Regression – Slides 7, 10", statement:"If exp(β₁) = 1, then the covariate x₁ has no effect on the odds of the outcome.", explanation:"Slide 7: β₁ = 0 → no effect; Slide 10: multiplying odds by exp(0) = 1 leaves them unchanged." },
  { num:26, answer:"FALSE", slide:"Logistic Regression – Slide 12",  statement:"Centering and rescaling of covariates in logistic regression changes the predicted probabilities.", explanation:"Slide 12: Only the coefficient scale changes; the linear predictor and predicted probabilities remain identical." },

  { num:27, task:"Task 5: Logistic Regression with Categorical Covariates", answer:"TRUE", slide:"Logistic Regression Categorical – Slide 3", statement:"When both x and y are binary, the relationship can be summarized in a 2×2 contingency table.", explanation:"Slide 3: 'x binary, y binary → 2×2 contingency table.'" },
  { num:28, answer:"TRUE",  slide:"Logistic Regression Categorical – Slides 7, 8", statement:"The odds ratio in a logit model with a binary covariate is given by exp(β₁).", explanation:"Slides 7–8 derive exp(β₁) as the odds ratio; shown numerically with exp(β̂₁) = 1.77." },
  { num:29, answer:"FALSE", slide:"Logistic Regression Categorical – Slide 10", statement:"In the South African heart disease dataset of binary outcomes for heart disease and binary covariates tobacco, alcohol, and family history, the fitted coefficient for alcohol is not statistically significant at the 5% level.", explanation:"Slide 10: alcohol p-value = 0.792 ≫ 0.05 → not significant. Tobacco and famhistPresent both have p < 0.001." },
  { num:30, answer:"TRUE",  slide:"Logistic Regression Categorical – Slide 10", statement:"In the South African heart disease dataset, the fitted logistic model estimate β̂_famhistPresent = 1.150282 gives an odds ratio exp(β̂_famhistPresent) greater than 1, indicating higher odds of heart disease when family history is present.", explanation:"Slide 10: β̂_famhistPresent = 1.150282 > 0, so exp(1.150282) > 1 — family history increases odds of heart disease." },
  { num:31, answer:"TRUE",  slide:"Logistic Regression Categorical – Slide 12", statement:"In a logit model with a multi-categorical covariate encoded with dummy coding, the intercept β₀ represents the log-odds for the reference category.", explanation:"Slide 12: with all dummies = 0 (reference category), the log-odds = β₀." },
  { num:32, answer:"TRUE",  slide:"Logistic Regression Categorical – Slide 17", statement:"In a logit model with interactions between binary covariates G and A, exp(β_GA) is the interaction odds ratio.", explanation:"Slide 17 interprets exp(β_GA): it quantifies how the gender odds ratio differs between age groups." },
  { num:33, answer:"FALSE", slide:"Logistic Regression Categorical – Slide 16", statement:"A model without an interaction term is always sufficient to capture the relationship between two binary covariates and a binary outcome.", explanation:"Slide 16: 'Model can't adequately display the relations... Better: Use model with interactions!'" },
  { num:34, answer:"TRUE",  slide:"Logistic Regression Categorical – Slide 17", statement:"In the interaction model log(π/(1−π)) = β₀ + β_G·G + β_A·A + β_GA·G·A, exp(β_G) is the odds ratio for G when A = 0.", explanation:"Slide 17: setting A=0, the model reduces to β₀ + β_G·G, so exp(β_G) is the odds ratio for gender in the A=0 baseline group." },

  { num:35, task:"Additional: Basic Concepts", answer:"FALSE", slide:"Basic Concepts – Slide 4", statement:"Regression analysis and correlation analysis answer the same fundamental question.", explanation:"Slide 4 poses this as a key distinction question: correlation is symmetric association; regression models the directional effect of x on y." },

const majorTopics = [
  'Fundamental Concepts',
  'Covariate Encoding & Categorical Covariates',
  'Binary Outcomes & Logistic Regression',
  'GLM Rationale & Distributions',
  'Grouped Data',
  'Score & Estimation',
  'Fisher Information & Inference',
  'Optimization & IRLS',
  'GLM Framework',
  'Model Comparison',
];

function getTaskName(q) {
  return q.task ? (taskMap[q.task] || q.task) : null;
}

function buildUI() {
  const main = document.getElementById('main');
  main.innerHTML = '';
  const filterBar = document.getElementById('filterBar');
  filterBar.innerHTML = '';

  // collect major topics
  const tasks = [];
  questions.forEach(q => {
    const major = getTaskName(q);
    if (major && !tasks.includes(major)) tasks.push(major);
  });

  const orderedTasks = majorTopics.filter(t => tasks.includes(t));

  // filter buttons
  const allBtn = document.createElement('button');
  allBtn.className = 'filter-btn' + (activeFilter === 'all' ? ' active' : '');
  allBtn.textContent = 'All';
  allBtn.onclick = () => { activeFilter = 'all'; buildUI(); };
  filterBar.appendChild(allBtn);

  const shuffleBtn = document.createElement('button');
  shuffleBtn.className = 'filter-btn' + (activeFilter === 'shuffle' ? ' active' : '');
  shuffleBtn.textContent = 'Shuffle';
  shuffleBtn.onclick = () => {
    activeFilter = 'shuffle';
    shuffledOrder = [...questions].sort(() => Math.random() - 0.5);
    buildUI();
  };
  filterBar.appendChild(shuffleBtn);

  orderedTasks.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn' + (activeFilter === t ? ' active' : '');
    btn.textContent = t;
    btn.onclick = () => { activeFilter = t; buildUI(); };
    filterBar.appendChild(btn);
  });

  // render questions
  let lastTask = null;
  const displayList = activeFilter === 'shuffle' ? shuffledOrder : questions;
  displayList.forEach((q, idx) => {
    const currentTask = getTaskName(q);

    if (activeFilter !== 'shuffle') {
      // determine current task for this question
      let thisTask = currentTask || lastTask;
      const prevTask = lastTask;
      if (currentTask) lastTask = currentTask;

      if (activeFilter !== 'all' && thisTask !== activeFilter) return;

      // section heading
      if (currentTask && (!prevTask || currentTask !== prevTask)) {
        const h = document.createElement('div');
        h.className = 'section-heading';
        h.textContent = currentTask;
        main.appendChild(h);
      }
    }

    const s = state[q.num];
    let cardClass = 'card';
    if (s.chosen) {
      cardClass += s.chosen === q.answer ? ' correct-answer' : ' wrong-answer';
    }
    if (s.revealed) {
      cardClass += ' revealed';
    }

    const card = document.createElement('div');
    card.className = cardClass;
    card.id = `card-${q.num}`;

    // top: number + statement
    card.innerHTML = `
      <div class="card-top">
        <span class="q-num">Q${activeFilter === 'shuffle' ? idx + 1 : q.num}</span>
        <span class="statement">${q.statement}</span>
      </div>
      <div class="answer-row">
        <button class="ans-btn ${s.chosen === 'TRUE' ? 'selected-true' : ''}" onclick="choose(${q.num},'TRUE')">TRUE</button>
        <button class="ans-btn ${s.chosen === 'FALSE' ? 'selected-false' : ''}" onclick="choose(${q.num},'FALSE')">FALSE</button>
      </div>
      <button class="reveal-btn" id="revbtn-${q.num}" onclick="reveal(${q.num})">${s.revealed ? '▲ Hide Answer' : '▼ Reveal Answer'}</button>
      <div class="answer-panel ${s.revealed ? 'visible' : ''}" id="panel-${q.num}">
        <span class="answer-badge ${q.answer.toLowerCase()}">${q.answer}</span>
        ${s.chosen ? `<span class="result-indicator ${s.chosen === q.answer ? 'correct' : 'wrong'}">${s.chosen === q.answer ? '✓ Correct' : '✗ Wrong'}</span>` : ''}
        <div class="slide-ref">${q.slide}</div>
        <div class="explanation">${q.explanation}</div>
      </div>
    `;
    main.appendChild(card);
  });

  updateStats();
}

function choose(num, val) {
  state[num].chosen = val;
  state[num].revealed = true;
  buildUI();
}

function reveal(num) {
  state[num].revealed = !state[num].revealed;
  buildUI();
  // scroll to card
  const el = document.getElementById(`card-${num}`);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function revealAll() {
  questions.forEach(q => { state[q.num].revealed = true; });
  buildUI();
}

function resetAll() {
  if (!confirm('Reset all answers and reveals?')) return;
  questions.forEach(q => { state[q.num] = { chosen: null, revealed: false }; });
  buildUI();
}

function updateStats() {
  let answered = 0, correct = 0, wrong = 0;
  questions.forEach(q => {
    const s = state[q.num];
    if (s.chosen) {
      answered++;
      if (s.chosen === q.answer) correct++;
      else wrong++;
    }
  });
  const score = correct - wrong;
  document.getElementById('s-answered').textContent = answered;
  document.getElementById('s-total').textContent = questions.length;
  document.getElementById('s-correct').textContent = correct;
  document.getElementById('s-wrong').textContent = wrong;
  document.getElementById('s-score').textContent = score;
  const pct = (answered / questions.length) * 100;
  document.getElementById('progressFill').style.width = pct + '%';
}

function showResults() {
  let answered = 0, correct = 0, wrong = 0, unanswered = 0;
  questions.forEach(q => {
    const s = state[q.num];
    if (s.chosen) { answered++; if (s.chosen === q.answer) correct++; else wrong++; }
    else unanswered++;
  });
  const score = correct - wrong;
  const maxScore = 30;
  document.getElementById('modalScore').textContent = score;
  document.getElementById('modalDetail').textContent = `${correct} correct · ${wrong} wrong · ${unanswered} unanswered (out of ${questions.length} practice questions)`;
  const badge = document.getElementById('modalBadge');
  badge.textContent = score >= 15 ? '✓ PASS (≥15/30)' : '✗ NOT YET (< 15/30)';
  badge.className = 'pass-badge ' + (score >= 15 ? 'pass' : 'fail');
  document.getElementById('modalUnanswered').textContent = unanswered > 0 ? `Note: ${unanswered} question(s) unanswered score 0 pts each.` : '';
  document.getElementById('modal').classList.add('open');
}

document.getElementById('modal').addEventListener('click', function(e) {
  if (e.target === this) this.classList.remove('open');
});

buildUI();
</script>
</body>
</html>
